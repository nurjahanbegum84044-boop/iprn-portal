<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Account Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e0b24;--bg2:#17123a;--card:rgba(255,255,255,.06);--bd:rgba(255,255,255,.12);--tx:#f3f1ff;--mu:#a9a3d6;--pr:#7c5cff;--pr2:#b69cff;--ok:#3df2c4;--bad:#ff6b81;--wa:#ffb547;--sh:0 20px 60px rgba(0,0,0,.4);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme=dark]){--bg:#f4f2ff;--bg2:#e7e2ff;--card:rgba(255,255,255,.75);--bd:rgba(60,40,140,.15);--tx:#1c1640;--mu:#5d558f;--ok:#00a37c;--bad:#d62f4b;--wa:#b86e00;--sh:0 20px 50px rgba(80,60,160,.18)}}
:root[data-theme=light]{--bg:#f4f2ff;--bg2:#e7e2ff;--card:rgba(255,255,255,.75);--bd:rgba(60,40,140,.15);--tx:#1c1640;--mu:#5d558f;--ok:#00a37c;--bad:#d62f4b;--wa:#b86e00;--sh:0 20px 50px rgba(80,60,160,.18)}
*{box-sizing:border-box;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{font:500 15px/1.6 'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;overflow-x:hidden}
.bgfx{position:fixed;inset:0;z-index:-1;overflow:hidden}
.bgfx i{position:absolute;width:48vmax;height:48vmax;border-radius:50%;filter:blur(90px);opacity:.45;animation:fl 18s ease-in-out infinite alternate}
.bgfx i:nth-child(1){background:var(--pr);top:-15vmax;left:-10vmax}
.bgfx i:nth-child(2){background:#ff6fb5;bottom:-20vmax;right:-12vmax;animation-delay:-6s;opacity:.28}
.bgfx i:nth-child(3){background:var(--ok);top:35%;left:45%;width:26vmax;height:26vmax;opacity:.14;animation-delay:-11s}
@keyframes fl{to{transform:translate(8vmax,6vmax) scale(1.2)}}
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 20px;background:var(--card);backdrop-filter:blur(18px);border-bottom:1px solid var(--bd)}
.logo{font-weight:700;font-size:20px;display:flex;align-items:center;gap:9px}
.logo b{width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,var(--pr),#ff6fb5);display:grid;place-items:center;color:#fff;animation:pulse 3s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 9px rgba(124,92,255,0)}0%{box-shadow:0 0 0 0 rgba(124,92,255,.6)}}
.sp{flex:1}
.seg{display:flex;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:4px;position:relative}
.seg button{position:relative;z-index:1;border:0;background:none;color:var(--mu);padding:7px 16px;border-radius:10px;font:inherit;cursor:pointer;transition:.25s}
.seg button.on{background:var(--pr);color:#fff;box-shadow:0 6px 18px rgba(124,92,255,.5)}
main{max-width:1100px;margin:0 auto;padding:22px 18px 80px}
nav.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:18px}
nav.tabs button{white-space:nowrap;border:1px solid var(--bd);background:var(--card);color:var(--mu);padding:9px 18px;border-radius:12px;font:inherit;cursor:pointer;transition:.2s}
nav.tabs button:hover{transform:translateY(-2px);color:var(--tx)}
nav.tabs button.on{background:linear-gradient(135deg,var(--pr),#9a6bff);color:#fff;border-color:transparent}
.view{animation:in .45s cubic-bezier(.2,.8,.2,1)}
@keyframes in{from{opacity:0;transform:translateY(14px) scale(.985)}}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));margin-bottom:18px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:18px;backdrop-filter:blur(14px);box-shadow:var(--sh);transition:transform .25s,border-color .25s}
.stat:hover{transform:translateY(-4px);border-color:var(--pr2)}
.stat small{color:var(--mu)}
.stat h2{font-size:32px;line-height:1.2;margin-top:4px;font-variant-numeric:tabular-nums}
.stat.ok h2{color:var(--ok)}.stat.bad h2{color:var(--bad)}.stat.wa h2{color:var(--wa)}
.hero{background:linear-gradient(135deg,rgba(124,92,255,.35),rgba(255,111,181,.18));position:relative;overflow:hidden}
.hero h2{font-size:clamp(34px,7vw,52px)}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.14) 50%,transparent 65%);transform:translateX(-100%);animation:sh 4.5s infinite}
@keyframes sh{to{transform:translateX(100%)}}
h3{margin-bottom:12px;font-size:18px}
label{display:block;color:var(--mu);font-size:13px;margin:10px 0 5px}
input,select,textarea{width:100%;background:rgba(127,120,200,.1);border:1px solid var(--bd);border-radius:12px;color:var(--tx);padding:11px 13px;font:inherit;outline:0;transition:.2s}
input:focus,select:focus,textarea:focus{border-color:var(--pr2);box-shadow:0 0 0 4px rgba(124,92,255,.22)}
select option{color:#111}
textarea{min-height:130px;resize:vertical;font-family:ui-monospace,monospace;font-size:13px}
.btn{position:relative;overflow:hidden;border:0;border-radius:12px;padding:11px 20px;font:inherit;font-weight:600;color:#fff;background:linear-gradient(135deg,var(--pr),#9a6bff);cursor:pointer;transition:.2s;box-shadow:0 8px 22px rgba(124,92,255,.4)}
.btn:hover{transform:translateY(-2px)}.btn:active{transform:scale(.96)}
.btn.g{background:var(--card);color:var(--tx);border:1px solid var(--bd);box-shadow:none}
.btn.ok{background:linear-gradient(135deg,#17c99a,#3df2c4);color:#06241b;box-shadow:0 8px 22px rgba(61,242,196,.3)}
.btn.bad{background:linear-gradient(135deg,#ff4d6a,#ff8aa0);box-shadow:0 8px 22px rgba(255,107,129,.3)}
.btn:focus-visible,nav button:focus-visible,.seg button:focus-visible{outline:3px solid var(--wa);outline-offset:2px}
.rp{position:absolute;border-radius:50%;background:rgba(255,255,255,.5);transform:scale(0);animation:rp .6s linear;pointer-events:none}
@keyframes rp{to{transform:scale(4);opacity:0}}
.row2{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:620px}
th{color:var(--mu);font-weight:500;font-size:13px;text-align:left;padding:8px 10px}
td{padding:10px;border-top:1px solid var(--bd)}
tr.rw{animation:in .4s both}
tr.rw:hover td{background:rgba(127,120,200,.08)}
.tag{display:inline-block;padding:2px 11px;border-radius:99px;font-size:12px;font-weight:600}
.tag.pending{background:rgba(255,181,71,.18);color:var(--wa)}
.tag.ok{background:rgba(61,242,196,.18);color:var(--ok)}
.tag.bad{background:rgba(255,107,129,.18);color:var(--bad)}
.bar{height:10px;background:rgba(127,120,200,.15);border-radius:9px;overflow:hidden;margin:4px 0 10px}
.bar i{display:block;height:100%;width:0;border-radius:9px;background:linear-gradient(90deg,var(--pr),#ff6fb5);transition:width 1.1s cubic-bezier(.2,.8,.2,1)}
.bar.ok i{background:linear-gradient(90deg,#17c99a,var(--ok))}
.bar.bad i{background:linear-gradient(90deg,#ff4d6a,#ff8aa0)}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.tools select{width:auto}
.empty{text-align:center;color:var(--mu);padding:34px 10px}
.empty b{display:block;font-size:34px;animation:bob 2s infinite}
@keyframes bob{50%{transform:translateY(-7px)}}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,120px);background:var(--bg2);border:1px solid var(--pr2);padding:12px 22px;border-radius:14px;transition:.4s cubic-bezier(.2,1.4,.4,1);z-index:50;box-shadow:var(--sh);max-width:90vw}
#toast.on{transform:translate(-50%,0)}
.gate{max-width:420px;margin:12vh auto}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
@media (max-width:600px){header{padding:10px 12px}main{padding:16px 12px 80px}}
</style></head><body>
<div class="bgfx"><i></i><i></i><i></i></div>
<header>
 <div class="logo"><b>◆</b>Account Hub</div><div class="sp"></div>
 <div class="seg" id="seg"><button data-r="seller">Seller</button><button data-r="admin">Admin</button></div>
 <button class="btn g" id="theme" aria-label="Toggle theme">◐</button>
</header>
<main id="app"></main><div id="toast" role="status"></div>
<script>
const $=s=>document.querySelector(s),T=Date.now;
const REASONS=['Wrong password','Checkpoint / locked','Duplicate','Wrong format','Banned / suspended'];
let S={subs:[],wds:[],rates:{Gmail:8,Facebook:15,Instagram:12},user:'',adminOk:false,theme:''};
try{Object.assign(S,JSON.parse(localStorage.getItem('ah2')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('ah2',JSON.stringify(S))}catch(e){}};
let role='seller',tab='dash',filt='pending',fdate='';
const TABS={seller:[['dash','Dashboard'],['sub','Submit Accounts'],['wd','Withdraw']],admin:[['ov','Overview'],['subs','Submissions'],['rep','Report'],['wds','Withdrawal Requests'],['rate','Rate Settings']]};
const tk=n=>'৳'+Math.round(n).toLocaleString('en-US'),nb=n=>Math.round(n).toLocaleString('en-US');
const day=t=>new Date(t).toISOString().slice(0,10),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ST={pending:'Pending',ok:'Good',bad:'Bad'};
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('on'),2600)}
const bal=u=>{const a=S.subs.filter(x=>x.u==u&&x.st=='ok').reduce((s,x)=>s+x.pay,0),w=S.wds.filter(x=>x.u==u&&x.st!='bad').reduce((s,x)=>s+x.amt,0);return a-w};
const stat=(l,n,c='',f=true)=>`<div class="card stat ${c}"><small>${l}</small><h2 data-n="${n}" data-f="${f?1:0}">0</h2></div>`;
function anim(){document.querySelectorAll('[data-n]').forEach(e=>{const n=+e.dataset.n,f=e.dataset.f=='1',t0=T();(function s(){const p=Math.min(1,(T()-t0)/900),v=n*(1-Math.pow(1-p,3));e.textContent=f?tk(v):nb(v);if(p<1)requestAnimationFrame(s)})()});
 requestAnimationFrame(()=>document.querySelectorAll('.bar i').forEach(i=>i.style.width=i.dataset.w+'%'))}
const empty=m=>`<div class="empty"><b>✦</b>${m}</div>`;
const rows=a=>a.map((x,i)=>`<tr class="rw" style="animation-delay:${Math.min(i,12)*30}ms">${x}</tr>`).join('');
/* ---------- SELLER ---------- */
function seller(){
 if(!S.user)return `<div class="card gate view"><h3>Welcome 👋</h3><p style="color:var(--mu)">Enter a username to get started.</p><label>Username</label><input id="un" maxlength="24" placeholder="e.g. rahim99"><br><br><button class="btn" id="go" style="width:100%">Get started</button></div>`;
 const m=S.subs.filter(x=>x.u==S.user);
 if(tab=='dash'){const ok=m.filter(x=>x.st=='ok').length,bd=m.filter(x=>x.st=='bad').length,pn=m.filter(x=>x.st=='pending').length,tot=m.length||1;
 return `<div class="view"><div class="card hero stat" style="margin-bottom:14px"><small>Current balance · ${esc(S.user)}</small><h2 data-n="${bal(S.user)}" data-f="1">0</h2></div>
 <div class="grid">${stat('Total submitted',m.length,'',false)}${stat('Pending',pn,'wa',false)}${stat('Good (will be paid)',ok,'ok',false)}${stat('Bad',bd,'bad',false)}</div>
 <div class="card" style="margin-bottom:14px"><h3>Success rate</h3><div class="bar ok"><i data-w="${Math.round(ok/tot*100)}"></i></div><small style="color:var(--mu)">${nb(ok/tot*100)}% Account good</small></div>
 <div class="card tw"><h3>My submissions</h3>${m.length?`<table><tr><th>Account</th><th>Type</th><th>Date</th><th>Status</th><th>Result</th></tr>${rows(m.slice().reverse().map(x=>`<td>${esc(x.id)}</td><td>${x.type}</td><td>${day(x.at)}</td><td><span class="tag ${x.st}">${ST[x.st]}</span></td><td>${x.st=='ok'?'+'+tk(x.pay):x.st=='bad'?esc(x.reason):'Awaiting report'}</td>`))}</table>`:empty('Nothing submitted yet. Submit your first account!')}</div></div>`}
 if(tab=='sub')return `<div class="row2 view"><div class="card"><h3>Submit accounts</h3><label>Account type</label><select id="ty">${Object.keys(S.rates).map(k=>`<option>${k}</option>`).join('')}</select><label>One per line: ID|Password</label><textarea id="bulk" placeholder="user1@gmail.com|pass123&#10;user2@gmail.com|pass456"></textarea><br><br><button class="btn" id="sb" style="width:100%">Submit</button></div>
 <div class="card"><h3>Rate card</h3>${Object.entries(S.rates).map(([k,v])=>`<div style="display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--bd)"><span>${k}</span><b style="color:var(--ok)">${tk(v)} / account</b></div>`).join('')}<p style="color:var(--mu);margin-top:12px">After you submit, the admin verifies accounts overnight and sends the report the next day. Duplicate IDs are rejected instantly.</p></div></div>`;
 const w=S.wds.filter(x=>x.u==S.user);
 return `<div class="row2 view"><div class="card"><h3>Request withdrawal</h3><p>Available balance: <b style="color:var(--ok)">${tk(bal(S.user))}</b></p><label>Method</label><select id="mt"><option>bKash</option><option>Nagad</option><option>Rocket</option></select><label>Number</label><input id="nm" inputmode="numeric" maxlength="11" placeholder="01XXXXXXXXX"><label>Amount (minimum ৳50)</label><input id="am" type="number" min="50"><br><br><button class="btn ok" id="wb" style="width:100%">Send request</button></div>
 <div class="card tw"><h3>Withdrawal history</h3>${w.length?`<table><tr><th>Date</th><th>Method</th><th>Amount</th><th>Status</th></tr>${rows(w.slice().reverse().map(x=>`<td>${day(x.at)}</td><td>${x.mt} ${x.nm}</td><td>${tk(x.amt)}</td><td><span class="tag ${x.st}">${x.st=='ok'?'Paid':x.st=='bad'?'Rejected':'Pending'}</span></td>`))}</table>`:empty('No withdrawals yet')}</div></div>`}
/* ---------- ADMIN ---------- */
function admin(){
 if(!S.adminOk)return `<div class="card gate view"><h3>Admin login 🔐</h3><label>PIN (demo: 1234)</label><input id="pin" type="password" inputmode="numeric"><br><br><button class="btn" id="ag" style="width:100%">Sign in</button></div>`;
 const A=S.subs,pn=A.filter(x=>x.st=='pending'),ok=A.filter(x=>x.st=='ok'),bd=A.filter(x=>x.st=='bad');
 if(tab=='ov'){const pw=S.wds.filter(x=>x.st=='pending').length;return `<div class="view"><div class="grid">${stat('Total submissions',A.length,'',false)}${stat('Awaiting review',pn.length,'wa',false)}${stat('Good',ok.length,'ok',false)}${stat('Bad',bd.length,'bad',false)}${stat('Total payout',ok.reduce((s,x)=>s+x.pay,0),'')}${stat('Pending withdrawals',pw,'wa',false)}</div>
 <div class="card"><h3>Good / bad by type</h3>${Object.keys(S.rates).map(k=>{const a=A.filter(x=>x.type==k&&x.st!='pending'),g=a.filter(x=>x.st=='ok').length;return `<div style="display:flex;justify-content:space-between"><span>${k}</span><small style="color:var(--mu)">${nb(g)}/${nb(a.length)} good</small></div><div class="bar ok"><i data-w="${a.length?Math.round(g/a.length*100):0}"></i></div>`}).join('')}</div></div>`}
 if(tab=='subs'){const L=A.filter(x=>filt=='all'||x.st==filt).slice().reverse();
 return `<div class="view card"><div class="tools"><select id="fl">${[['pending','Pending'],['ok','Good'],['bad','Bad'],['all','All']].map(([v,l])=>`<option value="${v}" ${v==filt?'selected':''}>${l}</option>`).join('')}</select><button class="btn ok" id="aok">✓ Mark selected good</button><select id="rs">${REASONS.map(r=>`<option>${r}</option>`).join('')}</select><button class="btn bad" id="abd">✗ Mark selected bad</button><span class="sp"></span><button class="btn g" id="xl">⬇ Download Excel</button></div>
 <div class="tw">${L.length?`<table><tr><th><input type="checkbox" id="all" style="width:auto"></th><th>Seller</th><th>ID</th><th>Password</th><th>Type</th><th>Status</th></tr>${rows(L.map(x=>`<td><input type="checkbox" class="ck" value="${x.k}" style="width:auto"></td><td>${esc(x.u)}</td><td>${esc(x.id)}</td><td>${esc(x.pw)}</td><td>${x.type}</td><td><span class="tag ${x.st}">${ST[x.st]}</span> ${x.st=='bad'?'<small>'+esc(x.reason)+'</small>':''}</td>`))}</table>`:empty('Nothing matches this filter')}</div></div>`}
 if(tab=='rep'){const d=fdate||day(T()),R=A.filter(x=>day(x.at)==d),g=R.filter(x=>x.st=='ok'),b=R.filter(x=>x.st=='bad'),sl=[...new Set(R.map(x=>x.u))],rc={};b.forEach(x=>rc[x.reason]=(rc[x.reason]||0)+1);
 return `<div class="view"><div class="tools"><input type="date" id="dt" value="${d}" style="width:auto"><button class="btn g" id="cp">📋 Copy report</button></div>
 <div class="grid">${stat('Submitted that day',R.length,'',false)}${stat('Good',g.length,'ok',false)}${stat('Bad',b.length,'bad',false)}${stat('Total payment',g.reduce((s,x)=>s+x.pay,0),'')}</div>
 <div class="row2"><div class="card tw"><h3>Payment by seller</h3>${sl.length?`<table style="min-width:340px"><tr><th>Seller</th><th>Good</th><th>Bad</th><th>Payout</th></tr>${rows(sl.map(u=>{const gg=g.filter(x=>x.u==u);return `<td>${esc(u)}</td><td style="color:var(--ok)">${nb(gg.length)}</td><td style="color:var(--bad)">${nb(R.filter(x=>x.u==u&&x.st=='bad').length)}</td><td><b>${tk(gg.reduce((s,x)=>s+x.pay,0))}</b></td>`}))}</table>`:empty('No data for this date')}</div>
 <div class="card"><h3>Reasons for bad accounts</h3>${Object.keys(rc).length?Object.entries(rc).map(([k,v])=>`<div style="display:flex;justify-content:space-between"><span>${k}</span><b>${nb(v)}</b></div><div class="bar bad"><i data-w="${Math.round(v/b.length*100)}"></i></div>`).join(''):empty('No bad accounts')}</div></div></div>`}
 if(tab=='wds'){const L=S.wds.slice().reverse();return `<div class="view card tw"><h3>Withdrawal Requests</h3>${L.length?`<table><tr><th>Seller</th><th>Method</th><th>Amount</th><th>Status</th><th></th></tr>${rows(L.map(x=>`<td>${esc(x.u)}</td><td>${x.mt} ${esc(x.nm)}</td><td>${tk(x.amt)}</td><td><span class="tag ${x.st}">${x.st=='ok'?'Paid':x.st=='bad'?'Rejected':'Pending'}</span></td><td>${x.st=='pending'?`<button class="btn ok" data-w="${x.k}" data-a="ok" style="padding:6px 12px">Mark paid</button> <button class="btn bad" data-w="${x.k}" data-a="bad" style="padding:6px 12px">Reject</button>`:''}</td>`))}</table>`:empty('No requests')}</div>`}
 return `<div class="view card" style="max-width:460px"><h3>Rate per account (৳)</h3>${Object.entries(S.rates).map(([k,v])=>`<label>${k}</label><input type="number" class="rt" data-k="${k}" value="${v}" min="0">`).join('')}<br><button class="btn" id="sr" style="width:100%">Save rates</button><p style="color:var(--mu);margin-top:10px">New rates apply only to accounts approved from now on.</p></div>`}
/* ---------- RENDER & EVENTS ---------- */
function render(){
 document.querySelectorAll('#seg button').forEach(b=>b.classList.toggle('on',b.dataset.r==role));
 const ts=TABS[role],show=role=='seller'?S.user:S.adminOk;
 $('#app').innerHTML=(show?`<nav class="tabs">${ts.map(([k,l])=>`<button data-t="${k}" class="${k==tab?'on':''}">${l}</button>`).join('')}</nav>`:'')+(role=='seller'?seller():admin());
 anim()}
function setRole(r){role=r;tab=TABS[r][0];render()}
document.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b)return;
 if(b.classList.contains('btn')){const r=document.createElement('span'),q=b.getBoundingClientRect(),s=Math.max(q.width,q.height);r.className='rp';r.style.cssText=`width:${s}px;height:${s}px;left:${e.clientX-q.left-s/2}px;top:${e.clientY-q.top-s/2}px`;b.appendChild(r);setTimeout(()=>r.remove(),600)}
 if(b.dataset.r)return setRole(b.dataset.r);
 if(b.dataset.t){tab=b.dataset.t;return render()}
 if(b.id=='theme'){S.theme=S.theme=='light'?'dark':'light';document.documentElement.dataset.theme=S.theme;return save()}
 if(b.id=='go'){const v=$('#un').value.trim();if(!v)return toast('Enter a username');S.user=v;save();return render()}
 if(b.id=='ag'){if($('#pin').value=='1234'){S.adminOk=true;save();render()}else toast('Wrong PIN');return}
 if(b.id=='sb'){const ty=$('#ty').value,ls=$('#bulk').value.split('\n').map(s=>s.trim()).filter(Boolean);if(!ls.length)return toast('Enter at least one account');
  let n=0,d=0;ls.forEach(l=>{const[id,pw=''] =l.split('|').map(s=>s.trim()),dup=S.subs.some(x=>x.id.toLowerCase()==id.toLowerCase()),o={k:T()+Math.random(),u:S.user,id,pw,type:ty,at:T(),st:'pending',reason:'',pay:0};if(dup){o.st='bad';o.reason='Duplicate';d++}else n++;S.subs.push(o)});
  save();toast(`${nb(n)} submitted${d?`, ${nb(d)} duplicate`:''}`);tab='dash';return render()}
 if(b.id=='wb'){const a=+$('#am').value,nm=$('#nm').value.trim();if(!/^01\d{9}$/.test(nm))return toast('Enter a valid 11-digit number');if(a<50)return toast('Minimum ৳50');if(a>bal(S.user))return toast('Insufficient balance');
  S.wds.push({k:T()+Math.random(),u:S.user,mt:$('#mt').value,nm,amt:a,at:T(),st:'pending'});save();toast('Withdrawal request sent');return render()}
 if(b.id=='aok'||b.id=='abd'){const ks=[...document.querySelectorAll('.ck:checked')].map(c=>+c.value);if(!ks.length)return toast('Select accounts first');
  S.subs.forEach(x=>{if(ks.includes(x.k)){if(b.id=='aok'){x.st='ok';x.pay=S.rates[x.type]||0;x.reason=''}else{x.st='bad';x.reason=$('#rs').value;x.pay=0}}});save();toast(`${nb(ks.length)} updated`);return render()}
 if(b.id=='xl'){const L=S.subs.filter(x=>filt=='all'||x.st==filt),h=['Seller','ID','Password','Type','Date','Status','Reason'],c=s=>'"'+String(s).replace(/"/g,'""')+'"';
  const csv='\ufeff'+[h,...L.map(x=>[x.u,x.id,x.pw,x.type,day(x.at),ST[x.st],x.reason])].map(r=>r.map(c).join(',')).join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download=`accounts-${day(T())}.csv`;a.click();return toast('Download started')}
 if(b.id=='cp'){const d=fdate||day(T()),R=S.subs.filter(x=>day(x.at)==d),sl=[...new Set(R.map(x=>x.u))];
  const t=`Report ${d}\n`+sl.map(u=>{const g=R.filter(x=>x.u==u&&x.st=='ok');return `${u}: good ${g.length}, bad ${R.filter(x=>x.u==u&&x.st=='bad').map(x=>x.reason).join('/')||0}, payment ${g.reduce((s,x)=>s+x.pay,0)}৳`}).join('\n');
  (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast('Report copied'),()=>toast('Copy failed'));return}
 if(b.dataset.w){const w=S.wds.find(x=>x.k==+b.dataset.w);if(w){w.st=b.dataset.a;save();toast(w.st=='ok'?'Marked as paid':'Rejected');render()}return}
 if(b.id=='sr'){document.querySelectorAll('.rt').forEach(i=>S.rates[i.dataset.k]=Math.max(0,+i.value||0));save();return toast('Rates saved')}});
document.addEventListener('change',e=>{const t=e.target;
 if(t.id=='fl'){filt=t.value;render()}
 if(t.id=='dt'){fdate=t.value;render()}
 if(t.id=='all')document.querySelectorAll('.ck').forEach(c=>c.checked=t.checked)});
if(S.theme)document.documentElement.dataset.theme=S.theme;
render();
</script></body></html>
