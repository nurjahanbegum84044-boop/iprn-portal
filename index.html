<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OTP & Message Finder</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 sm:p-8">
    <div class="max-w-4xl mx-auto">
        <header class="mb-8 text-center">
            <h1 class="text-3xl font-bold tracking-tight text-emerald-400 mb-2">OTP & Message Finder</h1>
            <p class="text-slate-400 text-sm">তারিখ এবং নাম্বার/ডিজিট দিয়ে ওটিপি খুঁজে নিন।</p>
        </header>

        <div class="bg-slate-800 border border-slate-700 rounded-xl p-6 shadow-xl mb-8">
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-4">
                <div>
                    <label class="block text-xs font-medium text-slate-400 uppercase mb-1">তারিখ (Date From - MM/DD/YYYY)</label>
                    <input type="text" id="dateFrom" placeholder="09/14/2026, 12:00 AM" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2.5 text-slate-100 text-xs focus:outline-none focus:border-emerald-500">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-400 uppercase mb-1">তারিখ (Date To - MM/DD/YYYY)</label>
                    <input type="text" id="dateTo" placeholder="09/14/2026, 11:59 PM" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2.5 text-slate-100 text-xs focus:outline-none focus:border-emerald-500">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-400 uppercase mb-1">নাম্বার বা ডিজিট</label>
                    <input type="text" id="searchNumber" placeholder="নাম্বার বা ডিজিট..." class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2.5 text-slate-100 text-xs focus:outline-none focus:border-emerald-500">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-400 uppercase mb-1">ম্যাচ করার ধরন</label>
                    <select id="matchType" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2.5 text-slate-100 text-xs focus:outline-none focus:border-emerald-500">
                        <option value="last">শেষ ডিজিট (Last Digits)</option>
                        <option value="exact">হুবহু নাম্বার (Exact Match)</option>
                    </select>
                </div>
            </div>
            <div class="text-right">
                <button onclick="fetchMessages()" id="searchBtn" class="bg-emerald-600 hover:bg-emerald-500 text-white font-semibold rounded-lg px-6 py-2.5 transition duration-200 shadow-md cursor-pointer text-sm">
                    সার্চ করুন
                </button>
            </div>
        </div>

        <div id="loading" class="hidden text-center py-8 text-emerald-400 animate-pulse font-medium">
            মেসেজ লোড হচ্ছে, অনুগ্রহ করে অপেক্ষা করুন...
        </div>

        <div id="resultsContainer" class="hidden">
            <h2 class="text-xl font-semibold mb-4 text-slate-200">ফলাফল (<span id="resultCount">0</span>)</h2>
            <div class="overflow-x-auto rounded-xl border border-slate-700 bg-slate-800 shadow-xl">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-700/50 text-slate-400 uppercase text-xs tracking-wider border-b border-slate-700">
                            <th class="p-4">তারিখ ও সময়</th>
                            <th class="p-4">নাম্বার (Number)</th>
                            <th class="p-4">সেন্ডার (CLI)</th>
                            <th class="p-4">ওটিপি কোড (OTP)</th>
                            <th class="p-4">ফুল মেসেজ (Full Message)</th>
                        </tr>
                    </thead>
                    <tbody id="messageTableBody" class="divide-y divide-slate-700 text-sm">
                    </tbody>
                </table>
            </div>
        </div>
        
        <div id="noResult" class="hidden text-center py-12 text-slate-500 bg-slate-800/50 rounded-xl border border-slate-700/50">
            কোনো ম্যাচিং মেসেজ পাওয়া যায়নি।
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-5 right-5 bg-emerald-600 text-white px-4 py-2 rounded-lg shadow-lg opacity-0 transition-opacity duration-300 pointer-events-none text-sm font-medium z-50">
        কপি করা হয়েছে!
    </div>

    <script>
        // Auto fill current date in UTC format on load
        window.onload = function() {
            const now = new Date();
            const mm = String(now.getUTCMonth() + 1).padStart(2, '0');
            const dd = String(now.getUTCDate()).padStart(2, '0');
            const yyyy = now.getUTCFullYear();
            const dateStr = `${mm}/${dd}/${yyyy}`;
            
            document.getElementById('dateFrom').value = `${dateStr}, 12:00 AM`;
            document.getElementById('dateTo').value = `${dateStr}, 11:59 PM`;
        };

        function showToast(message = "কপি করা হয়েছে!") {
            const toast = document.getElementById('toast');
            toast.innerText = message;
            toast.style.opacity = '1';
            setTimeout(() => {
                toast.style.opacity = '0';
            }, 2000);
        }

        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(() => {
                showToast();
            }).catch(err => {
                console.error('Failed to copy: ', err);
            });
        }

        async function fetchMessages() {
            const query = document.getElementById('searchNumber').value.trim();
            const matchType = document.getElementById('matchType').value;
            const dateFrom = document.getElementById('dateFrom').value.trim();
            const dateTo = document.getElementById('dateTo').value.trim();
            
            if (!query) {
                alert('দয়া করে নাম্বার বা ডিজিট লিখুন।');
                return;
            }

            const loading = document.getElementById('loading');
            const resultsContainer = document.getElementById('resultsContainer');
            const noResult = document.getElementById('noResult');
            const tableBody = document.getElementById('messageTableBody');
            
            loading.classList.remove('hidden');
            resultsContainer.classList.add('hidden');
            noResult.classList.add('hidden');
            tableBody.innerHTML = '';

            try {
                const params = new URLSearchParams({
                    query: query,
                    type: matchType,
                    from: dateFrom,
                    to: dateTo
                });

                const response = await fetch(`/api/search?${params.toString()}`);
                const data = await response.json();

                loading.classList.add('hidden');

                if (data.success && data.messages.length > 0) {
                    document.getElementById('resultCount').innerText = data.messages.length;
                    data.messages.forEach(msg => {
                        const tr = document.createElement('tr');
                        tr.className = 'hover:bg-slate-700/30 transition';
                        
                        tr.innerHTML = `
                            <td class="p-4 text-slate-400 whitespace-nowrap text-xs">${msg.time}</td>
                            <td class="p-4 font-mono text-emerald-400 font-medium">${msg.number}</td>
                            <td class="p-4 font-mono text-slate-300">${msg.cli}</td>
                            <td class="p-4">
                                <button onclick="copyToClipboard('${msg.otp}')" class="bg-slate-700 hover:bg-emerald-600 text-emerald-300 hover:text-white px-3 py-1.5 rounded font-mono font-bold text-xs transition border border-slate-600 flex items-center gap-1.5 shadow-sm cursor-pointer" title="ক্লিক করে কপি করুন">
                                    <span>${msg.otp}</span>
                                    <svg class="w-3.5 h-3.5 opacity-70" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                                </button>
                            </td>
                            <td class="p-4 max-w-xs">
                                <button onclick="copyToClipboard(this.getAttribute('data-full-text'))" data-full-text="${msg.text.replace(/"/g, '&quot;')}" class="text-left text-slate-300 hover:text-white block w-full bg-slate-900/50 p-2 rounded border border-slate-700/50 text-xs cursor-pointer truncate" title="সম্পূর্ণ মেসেজ দেখতে ও কপি করতে ক্লিক করুন">
                                    ${msg.text}
                                </button>
                            </td>
                        `;
                        tableBody.appendChild(tr);
                    });
                    resultsContainer.classList.remove('hidden');
                } else {
                    noResult.classList.remove('hidden');
                }
            } catch (error) {
                loading.classList.add('hidden');
                alert('ডেটা ফেচ করতে সমস্যা হয়েছে। আবার চেষ্টা করুন।');
                console.error(error);
            }
        }
    </script>
</body>
</html>
