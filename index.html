<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MNIT Network Dashboard Pro - Ultra Fast OTP</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- SheetJS for Excel Export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .toggle-checkbox:checked { right: 0; border-color: #6366f1; }
        .toggle-checkbox:checked + .toggle-label { background-color: #6366f1; }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 min-h-screen font-sans pb-12">

    <!-- Top Navigation Bar -->
    <div class="bg-white border-b shadow-sm sticky top-0 z-50 px-4 py-2.5">
        <div class="container mx-auto flex justify-between items-center max-w-xl">
            <div class="flex items-center gap-2">
                <span class="bg-indigo-600 text-white font-black px-2.5 py-1 rounded-lg text-xs">MNIT</span>
                <span class="text-xs font-bold text-gray-700">SMS Portal <span id="liveIndicator" class="text-[10px] text-emerald-500 font-normal">● Live Listening</span></span>
            </div>

            <div class="flex items-center gap-2 relative">
                <button onclick="exportMainToExcel()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-1.5 shadow transition">
                    <i class="fa-solid fa-file-excel"></i> এক্সেল (Num & OTP)
                </button>

                <div class="relative">
                    <button onclick="toggleMenu(event)" class="w-8 h-8 rounded-lg hover:bg-gray-100 flex items-center justify-center text-gray-600 transition">
                        <i class="fa-solid fa-ellipsis-vertical text-base"></i>
                    </button>

                    <div id="dropdownMenu" class="hidden absolute right-0 mt-2 w-60 bg-white rounded-2xl shadow-xl border border-gray-100 py-2 z-50 text-xs font-medium">
                        <button onclick="openGlobalConsoleModal()" class="w-full text-left px-4 py-2.5 hover:bg-indigo-50 hover:text-indigo-600 flex items-center gap-2.5 transition">
                            <i class="fa-solid fa-globe text-indigo-500 w-4"></i> Global Live Console
                        </button>
                        <button onclick="openSuccessOtpsModal()" class="w-full text-left px-4 py-2.5 hover:bg-emerald-50 hover:text-emerald-600 flex items-center gap-2.5 transition">
                            <i class="fa-solid fa-shield-halved text-emerald-500 w-4"></i> Permanent Success OTPs
                        </button>
                        <button onclick="openConsoleHistoryModal()" class="w-full text-left px-4 py-2.5 hover:bg-blue-50 hover:text-blue-600 flex items-center gap-2.5 transition">
                            <i class="fa-solid fa-clock-rotate-left text-blue-500 w-4"></i> Console Range & Platform History
                        </button>
                        <div class="border-t border-gray-100 my-1"></div>
                        <button onclick="clearLocalStorageData()" class="w-full text-left px-4 py-2.5 hover:bg-red-50 text-red-600 flex items-center gap-2.5 transition">
                            <i class="fa-solid fa-trash-can w-4"></i> Reset Local Storage
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="container mx-auto p-4 max-w-xl space-y-6">
        
        <!-- Number Range Card with Bulk Generator Box [ ] -->
        <div class="bg-white p-5 rounded-3xl shadow-sm border border-gray-200">
            <h2 class="text-sm font-bold text-gray-700 mb-3 tracking-wide">Number Range & Bulk Generator</h2>
            
            <div class="flex gap-2 mb-4">
                <input type="text" id="pinInput" placeholder="232761XXX" oninput="saveRangeInput(this.value)" class="flex-1 bg-white border border-gray-300 rounded-2xl px-4 py-3 text-gray-800 font-medium placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
                <div class="w-20 relative" title="একসাথে কয়টি নাম্বার নিতে চান (১-১০০)">
                    <span class="absolute -top-2 left-3 bg-white px-1 text-[10px] font-bold text-indigo-600">Qty [ ]</span>
                    <input type="number" id="bulkQtyInput" value="1" min="1" max="100" class="w-full h-full bg-white border border-indigo-300 rounded-2xl px-3 text-center text-indigo-700 font-bold text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
            </div>

            <div class="flex items-center justify-between mb-5 px-1">
                <label class="flex items-center cursor-pointer gap-2 select-none">
                    <div class="relative">
                        <input type="checkbox" id="nationalToggle" class="sr-only toggle-checkbox">
                        <div class="block bg-gray-300 w-10 h-6 rounded-full toggle-label transition"></div>
                    </div>
                    <span class="text-xs font-medium text-gray-600">National</span>
                </label>

                <label class="flex items-center cursor-pointer gap-2 select-none">
                    <div class="relative">
                        <input type="checkbox" id="removePlusToggle" class="sr-only toggle-checkbox">
                        <div class="block bg-gray-300 w-10 h-6 rounded-full toggle-label transition"></div>
                    </div>
                    <span class="text-xs font-medium text-gray-600">Remove Plus</span>
                </label>
            </div>

            <div class="flex items-center gap-3">
                <div class="border border-gray-300 rounded-2xl p-3 flex items-center justify-center text-gray-600">
                    <i class="fa-solid fa-mobile-screen text-lg"></i>
                </div>
                <button onclick="fetchNumber()" class="flex-1 bg-[#6366f1] hover:bg-[#4f46e5] text-white font-semibold py-3 px-6 rounded-2xl shadow-lg shadow-indigo-500/25 transition text-sm flex justify-center items-center gap-2">
                    <i class="fa-solid fa-paper-plane text-xs"></i> Get Numbers
                </button>
            </div>
        </div>

        <!-- Table Headers -->
        <div class="bg-white rounded-3xl shadow-sm border border-gray-200 overflow-hidden">
            <div class="grid grid-cols-3 p-4 border-b border-gray-100 text-[11px] font-bold text-gray-400 uppercase tracking-wider text-center">
                <div class="text-left flex items-center gap-1.5"><i class="fa-solid fa-mobile-screen"></i> Phone Number</div>
                <div><i class="fa-solid fa-globe"></i> Country</div>
                <div class="text-right"><i class="fa-regular fa-clock"></i> Last Activity</div>
            </div>

            <div id="cardsContainer" class="divide-y divide-gray-100">
                <!-- Dynamic Items -->
            </div>
        </div>

    </div>

    <!-- MODALS -->
    <div id="globalConsoleModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm hidden z-50 flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-lg rounded-3xl shadow-2xl overflow-hidden flex flex-col max-h-[80vh]">
            <div class="p-4 bg-indigo-600 text-white flex justify-between items-center font-bold text-sm">
                <span><i class="fa-solid fa-globe mr-2"></i> Global Live Console</span>
                <button onclick="closeModal('globalConsoleModal')" class="text-white text-lg">&times;</button>
            </div>
            <div id="globalConsoleBody" class="p-4 overflow-y-auto space-y-3 text-xs divide-y divide-gray-100"></div>
        </div>
    </div>

    <div id="successOtpsModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm hidden z-50 flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-lg rounded-3xl shadow-2xl overflow-hidden flex flex-col max-h-[80vh]">
            <div class="p-4 bg-emerald-600 text-white flex justify-between items-center font-bold text-sm">
                <span><i class="fa-solid fa-shield-halved mr-2"></i> Permanent Success OTPs</span>
                <div class="flex items-center gap-3">
                    <button onclick="exportSuccessOtpsToExcel()" class="bg-white text-emerald-700 px-2.5 py-1 rounded-lg text-xs font-bold shadow">এক্সেল ডাউনলোড</button>
                    <button onclick="closeModal('successOtpsModal')" class="text-white text-lg">&times;</button>
                </div>
            </div>
            <div id="successOtpsBody" class="p-4 overflow-y-auto space-y-3 text-xs divide-y divide-gray-100"></div>
        </div>
    </div>

    <div id="consoleHistoryModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm hidden z-50 flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-lg rounded-3xl shadow-2xl overflow-hidden flex flex-col max-h-[80vh]">
            <div class="p-4 bg-blue-600 text-white flex justify-between items-center font-bold text-sm">
                <span><i class="fa-solid fa-clock-rotate-left mr-2"></i> Range, Platform & Full Date History</span>
                <div class="flex items-center gap-3">
                    <button onclick="exportHistoryToExcel()" class="bg-white text-blue-700 px-2.5 py-1 rounded-lg text-xs font-bold shadow">এক্সেল ডাউনলোড</button>
                    <button onclick="closeModal('consoleHistoryModal')" class="text-white text-lg">&times;</button>
                </div>
            </div>
            <div id="consoleHistoryBody" class="p-4 overflow-y-auto space-y-3 text-xs divide-y divide-gray-100"></div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-gray-900/90 text-white px-5 py-3 rounded-2xl shadow-2xl text-xs font-medium tracking-wide flex items-center gap-3 opacity-0 pointer-events-none transition-all duration-300 z-50 backdrop-blur">
        <div class="bg-emerald-500 text-white rounded-full w-5 h-5 flex items-center justify-center text-[10px]">
            <i class="fa-solid fa-check"></i>
        </div>
        <span id="toastText">Copied to clipboard.</span>
    </div>

    <script>
        const API_BASE = "https://api.2oo9.cloud/MXS47FLFX0U/tness/@public/api/";
        const API_KEY = "M8OSXY9XKQ3";

        document.addEventListener("DOMContentLoaded", () => {
            let savedRange = localStorage.getItem('mnit_saved_range') || '';
            if(savedRange) {
                document.getElementById('pinInput').value = savedRange;
            }

            loadCards();
            
            // High-frequency Background Listener (Hits every 1 second to never miss OTP)
            setInterval(fetchAllBackgroundAPIs, 1000);

            window.addEventListener('click', (e) => {
                let menu = document.getElementById('dropdownMenu');
                if(!e.target.closest('button')) {
                    menu.classList.add('hidden');
                }
            });
        });

        function toggleMenu(event) {
            event.stopPropagation();
            let menu = document.getElementById('dropdownMenu');
            menu.classList.toggle('hidden');
        }

        function closeModal(modalId) {
            document.getElementById(modalId).classList.add('hidden');
        }

        function saveRangeInput(val) {
            localStorage.setItem('mnit_saved_range', val);
        }

        // Helper to extract clean OTP from text message
        function extractOtpCode(message) {
            if (!message || message.includes("Waiting")) return "---";
            // Matches 4 to 8 digit numbers or codes after keywords like code, otp etc.
            let match = message.match(/\b\d{4,8}\b/);
            return match ? match[0] : message;
        }

        async function fetchNumber() {
            let pinInputVal = document.getElementById('pinInput').value.trim();
            let qty = parseInt(document.getElementById('bulkQtyInput').value) || 1;
            if (!pinInputVal) {
                showToast("দয়া করে নাম্বার রেঞ্জ দিন (যেমন: 232761)");
                return;
            }
            let rid = pinInputVal.replace(/XXX/gi, "").trim();
            qty = Math.min(Math.max(qty, 1), 100);

            let allFetchedNumbers = [];
            showToast(`Fetching ${qty} numbers...`);

            for (let i = 0; i < qty; i++) {
                try {
                    let response = await fetch(`${API_BASE}getnum`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', 'mauthapi': API_KEY },
                        body: JSON.stringify({ rid: rid })
                    });
                    let result = await response.json();
                    
                    if (result.meta && result.meta.code === 200) {
                        let rawNumber = result.data.full_number || '';
                        let cleanNumDigits = rawNumber.replace(/\D/g, '');

                        if(document.getElementById('nationalToggle').checked) rawNumber = result.data.national_number || rawNumber;
                        if(document.getElementById('removePlusToggle').checked) rawNumber = rawNumber.replace(/^\+/, '');

                        const dataObj = {
                            id: 'item_' + Date.now() + '_' + i,
                            time: new Date().toLocaleTimeString(),
                            full_number: rawNumber,
                            digits: cleanNumDigits,
                            country: (result.data.country || 'UNKNOWN').toUpperCase(),
                            message: 'Waiting for OTP...'
                        };

                        saveToLocalStorageDirect('mnit_exact_data', dataObj);
                        allFetchedNumbers.push(rawNumber);
                    }
                } catch (error) {
                    console.error("Fetch loop error", error);
                }
            }

            loadCards();

            if(allFetchedNumbers.length > 0) {
                let combinedText = allFetchedNumbers.join('\n');
                copyToClipboard(combinedText);
                showToast(`${allFetchedNumbers.length} numbers copied automatically!`);
            } else {
                showToast("No numbers available or out of stock!");
            }
        }

        // Ultra-fast background listener to catch OTPs instantly
        async function fetchAllBackgroundAPIs() {
            try {
                let resOtp = await fetch(`${API_BASE}success-otp`, { headers: { 'mauthapi': API_KEY } });
                let dataOtp = await resOtp.json();
                
                if(dataOtp.meta?.code === 200 && dataOtp.data?.otps) {
                    let savedData = JSON.parse(localStorage.getItem('mnit_exact_data')) || [];
                    let permanentSuccess = JSON.parse(localStorage.getItem('mnit_permanent_success_otps')) || [];
                    let updated = false;

                    dataOtp.data.otps.forEach(otp => {
                        let otpNumClean = (otp.number || '').replace(/\D/g, '');

                        savedData.forEach(item => {
                            let itemDigits = (item.digits || item.full_number).replace(/\D/g, '');
                            if((itemDigits.includes(otpNumClean) || otpNumClean.includes(itemDigits)) && item.message !== otp.message) {
                                item.message = otp.message;
                                updated = true;
                                let extractedCode = extractOtpCode(otp.message);
                                copyToClipboard(extractedCode); // Auto-copy clean OTP
                            }
                        });

                        let exists = permanentSuccess.some(s => s.number === otp.number && s.otp === otp.message);
                        if(!exists) {
                            permanentSuccess.unshift({
                                number: otp.number,
                                otp: otp.message,
                                time: new Date().toLocaleString()
                            });
                        }
                    });

                    if(updated) {
                        localStorage.setItem('mnit_exact_data', JSON.stringify(savedData));
                        loadCards();
                    }
                    localStorage.setItem('mnit_permanent_success_otps', JSON.stringify(permanentSuccess));
                }

                let resConsole = await fetch(`${API_BASE}console`, { headers: { 'mauthapi': API_KEY } });
                let dataConsole = await resConsole.json();
                if(dataConsole.meta?.code === 200 && dataConsole.data?.hits) {
                    let history = JSON.parse(localStorage.getItem('mnit_console_history')) || [];
                    dataConsole.data.hits.forEach(hit => {
                        let hitObj = {
                            range: hit.range || 'N/A',
                            platform: hit.sid || 'N/A',
                            message: hit.message || 'N/A',
                            full_date: new Date(hit.time || Date.now()).toLocaleString()
                        };
                        let exists = history.some(h => h.full_date === hitObj.full_date && h.message === hitObj.message);
                        if(!exists) {
                            history.unshift(hitObj);
                        }
                    });
                    localStorage.setItem('mnit_console_history', JSON.stringify(history));
                }
            } catch(e) {}
        }

        function saveToLocalStorageDirect(key, newItem) {
            let savedData = JSON.parse(localStorage.getItem(key)) || [];
            savedData.unshift(newItem);
            if(savedData.length > 200) savedData.pop();
            localStorage.setItem(key, JSON.stringify(savedData));
        }

        function copyToClipboard(text) {
            navigator.clipboard.writeText(text);
        }

        function showToast(text) {
            let toast = document.getElementById('toast');
            document.getElementById('toastText').innerText = text;
            toast.classList.remove('opacity-0', 'pointer-events-none');
            setTimeout(() => toast.classList.add('opacity-0', 'pointer-events-none'), 3000);
        }

        function loadCards() {
            let savedData = JSON.parse(localStorage.getItem('mnit_exact_data')) || [];
            let container = document.getElementById('cardsContainer');
            container.innerHTML = "";

            if (savedData.length === 0) {
                container.innerHTML = `<div class="p-8 text-center text-gray-400 text-xs">কোনো ডাটা সংরক্ষিত নেই।</div>`;
                return;
            }

            let htmlString = "";
            savedData.forEach(item => {
                let isPending = item.message.includes("Waiting");
                let extractedOtp = extractOtpCode(item.message);

                htmlString += `
                    <div class="p-4 transition hover:bg-gray-50/80 space-y-2">
                        <div class="grid grid-cols-3 items-center text-sm">
                            <div class="text-left space-y-1.5">
                                <span class="font-bold text-gray-900 tracking-wide select-all text-sm block">${item.full_number}</span>
                                <span class="px-2.5 py-0.5 rounded-full text-[10px] font-bold uppercase tracking-wide ${isPending ? 'bg-amber-100 text-amber-700' : 'bg-emerald-100 text-emerald-700'}">${isPending ? 'pending' : 'success'}</span>
                            </div>
                            <div class="text-center">
                                <span class="bg-[#5856d6] text-white px-3 py-1 rounded-lg text-[10px] font-bold uppercase tracking-wider inline-block shadow-sm">${item.country}</span>
                            </div>
                            <div class="text-right text-xs text-gray-400 font-medium">${item.time}</div>
                        </div>

                        <!-- Top Box: Full Message -->
                        <div class="bg-cyan-50/60 border border-cyan-100/80 px-3 py-2 rounded-xl flex justify-between items-center text-cyan-900 text-xs font-semibold">
                            <span class="select-all truncate">${item.message}</span>
                            <button onclick="copyToClipboard('${item.message.replace(/'/g, "\\'")}'); showToast('Full Message Copied');" class="text-cyan-600 hover:text-cyan-800 ml-2 shrink-0"><i class="fa-regular fa-copy"></i></button>
                        </div>

                        <!-- Bottom Box: Only Clean OTP Code -->
                        <div class="bg-emerald-50/80 border border-emerald-200 px-3 py-2 rounded-xl flex justify-between items-center text-emerald-900 text-xs font-bold">
                            <span class="select-all tracking-wider text-sm">${extractedOtp}</span>
                            <div class="flex items-center gap-2">
                                <button onclick="copyToClipboard('${extractedOtp}'); showToast('OTP Copied');" class="text-emerald-700 hover:text-emerald-900 shrink-0"><i class="fa-regular fa-copy mr-1"></i> ওটিপি কপি</button>
                                <button onclick="copyToClipboard('${item.full_number}'); showToast('Number Copied');" class="bg-gray-100 hover:bg-gray-200 text-gray-600 px-2.5 py-1 rounded-lg text-[11px] font-medium transition shrink-0"><i class="fa-regular fa-copy"></i> নম্বর কপি</button>
                            </div>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = htmlString;
        }

        async function openGlobalConsoleModal() {
            document.getElementById('dropdownMenu').classList.add('hidden');
            document.getElementById('globalConsoleModal').classList.remove('hidden');
            let body = document.getElementById('globalConsoleBody');
            body.innerHTML = `<div class="text-center text-gray-400 py-4">লোডিং হচ্ছে...</div>`;
            
            try {
                let res = await fetch(`${API_BASE}console`, { headers: { 'mauthapi': API_KEY } });
                let data = await res.json();
                body.innerHTML = "";
                if(data.meta?.code === 200 && data.data?.hits) {
                    data.data.hits.slice(0, 50).forEach(hit => {
                        body.innerHTML += `<div class="py-2 flex justify-between items-center"><div><strong class="text-indigo-600">[${hit.sid}]</strong> Range: ${hit.range}<p class="text-gray-500">${hit.message}</p></div><span class="text-[10px] text-gray-400">${new Date(hit.time || Date.now()).toLocaleTimeString()}</span></div>`;
                    });
                } else {
                    body.innerHTML = `<div class="text-center text-gray-400 py-4">কোনো লাইভ কনসোল ডাটা পাওয়া যায়নি।</div>`;
                }
            } catch(e) { body.innerHTML = `<div class="text-center text-red-400 py-4">লোড করতে সমস্যা হয়েছে।</div>`; }
        }

        function openSuccessOtpsModal() {
            document.getElementById('dropdownMenu').classList.add('hidden');
            document.getElementById('successOtpsModal').classList.remove('hidden');
            let saved = JSON.parse(localStorage.getItem('mnit_permanent_success_otps')) || [];
            let body = document.getElementById('successOtpsBody');
            body.innerHTML = "";
            if(saved.length === 0) {
                body.innerHTML = `<div class="text-center text-gray-400 py-4">কোনো সফল ওটিপি সংরক্ষিত নেই।</div>`;
                return;
            }
            saved.slice(0, 100).forEach(item => {
                body.innerHTML += `<div class="py-2 flex justify-between items-center"><div><strong class="text-emerald-600">${item.number}</strong><p class="text-gray-700 font-medium">${item.otp}</p></div><span class="text-[10px] text-gray-400">${item.time}</span></div>`;
            });
        }

        function openConsoleHistoryModal() {
            document.getElementById('dropdownMenu').classList.add('hidden');
            document.getElementById('consoleHistoryModal').classList.remove('hidden');
            let saved = JSON.parse(localStorage.getItem('mnit_console_history')) || [];
            let body = document.getElementById('consoleHistoryBody');
            body.innerHTML = "";
            if(saved.length === 0) {
                body.innerHTML = `<div class="text-center text-gray-400 py-4">কোনো হিস্ট্রি সংরক্ষিত নেই।</div>`;
                return;
            }
            saved.slice(0, 100).forEach(item => {
                body.innerHTML += `<div class="py-2 space-y-1"><div class="flex justify-between"><span class="bg-blue-100 text-blue-700 px-2 py-0.5 rounded text-[10px] font-bold">${item.platform}</span><span class="text-[10px] text-gray-400">${item.full_date}</span></div><p class="text-gray-700">Range: <b>${item.range}</b> | Msg: ${item.message}</p></div>`;
            });
        }

        function exportMainToExcel() {
            let savedData = JSON.parse(localStorage.getItem('mnit_exact_data')) || [];
            if (savedData.length === 0) { showToast("ডাউনলোড করার মতো ডাটা নেই!"); return; }
            let excelData = savedData.map(item => ({ "Phone Number": item.full_number, "Full Message": item.message, "Extracted OTP": extractOtpCode(item.message) }));
            let worksheet = XLSX.utils.json_to_sheet(excelData);
            let workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "Numbers_OTP");
            XLSX.writeFile(workbook, "MNIT_Numbers_and_OTP.xlsx");
        }

        function exportSuccessOtpsToExcel() {
            let saved = JSON.parse(localStorage.getItem('mnit_permanent_success_otps')) || [];
            if (saved.length === 0) { showToast("কোনো সফল ওটিপি নেই!"); return; }
            let excelData = saved.map(item => ({ "Phone Number": item.number, "OTP / Message": item.otp, "Time": item.time }));
            let worksheet = XLSX.utils.json_to_sheet(excelData);
            let workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "Success_OTPs");
            XLSX.writeFile(workbook, "Permanent_Success_OTPs.xlsx");
        }

        function exportHistoryToExcel() {
            let saved = JSON.parse(localStorage.getItem('mnit_console_history')) || [];
            if (saved.length === 0) { showToast("কোনো হিস্ট্রি নেই!"); return; }
            let worksheet = XLSX.utils.json_to_sheet(saved);
            let workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "Console_History");
            XLSX.writeFile(workbook, "Console_Range_Platform_History.xlsx");
        }

        function clearLocalStorageData() {
            if (confirm("সব লোকাল স্টোরেজ ডাটা মুছে ফেলতে চান?")) {
                localStorage.clear();
                location.reload();
            }
        }
    </script>
</body>
