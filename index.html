<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <title>Website Self-Tester</title>
  <style>
    body { margin: 0; font-family: sans-serif; }
    #toolbar { background: #2c3e50; color: #fff; padding: 12px; position: fixed; top: 0; left: 0; right: 0; z-index: 9999; display: flex; gap: 10px; align-items: center; }
    input[type="text"] { padding: 6px; width: 300px; border-radius: 4px; border: none; }
    button { padding: 6px 14px; cursor: pointer; border: none; border-radius: 4px; font-weight: bold; }
    .btn-rec { background: #e74c3c; color: white; }
    .btn-save { background: #3498db; color: white; }
    .btn-play { background: #2ecc71; color: white; }
    #test-frame { width: 100%; height: calc(100vh - 55px); margin-top: 55px; border: none; }
  </style>
</head>
<body>

  <div id="toolbar">
    <input type="text" id="targetUrl" placeholder="/my-page.html (নিজের পেজের ইউআরএল)">
    <button onclick="loadPage()">ওপেন</button>
    <button class="btn-rec" onclick="startRecording()">🔴 রেকর্ড</button>
    <button class="btn-save" onclick="stopRecording()">💾 সেভ</button>
    <button class="btn-play" onclick="playAutomation()">▶️ স্টার্ট</button>
    <span id="status">স্ট্যাটাস: নিষ্ক্রিয়</span>
  </div>

  <iframe id="test-frame" src="about:blank"></iframe>

  <script>
    let recordedSteps = [];
    let isRecording = false;
    let isPlaying = false;
    const iframe = document.getElementById('test-frame');

    function loadPage() {
      const url = document.getElementById('targetUrl').value;
      if (url) iframe.src = url;
    }

    function startRecording() {
      recordedSteps = [];
      isRecording = true;
      document.getElementById('status').innerText = 'স্ট্যাটাস: রেকর্ড হচ্ছে...';
      
      const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
      
      // ইভেন্ট লিসেনার দিয়ে ক্লিক ট্র্যাক করা
      iframeDoc.addEventListener('click', function(e) {
        if (!isRecording) return;
        const selector = getCssPath(e.target);
        recordedSteps.push({ type: 'click', selector: selector });
      }, true);
    }

    function stopRecording() {
      isRecording = false;
      document.getElementById('status').innerText = `স্ট্যাটাস: ${recordedSteps.length} টি অ্যাকশন সেভ হয়েছে`;
    }

    async function playAutomation() {
      if (recordedSteps.length === 0) return alert('কোনো অ্যাকশন সেভ করা নেই!');
      isPlaying = true;
      document.getElementById('status').innerText = 'স্ট্যাটাস: অটোমেশন চলছে...';
      
      const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;

      for (let step of recordedSteps) {
        if (!isPlaying) break;
        await new Promise(r => setTimeout(r, 1200)); // প্রতিটি ক্লিকের মাঝে ১.২ সেকেন্ড বিরতি
        
        if (step.type === 'click') {
          const el = iframeDoc.querySelector(step.selector);
          if (el) {
            el.style.outline = '2px solid red'; // ভিজ্যুয়াল ফিডব্যাক
            el.click();
          }
        }
      }
      document.getElementById('status').innerText = 'স্ট্যাটাস: টেস্ট সম্পন্ন!';
    }

    // ইউনিক CSS Selector তৈরি করার ফাংশন
    function getCssPath(el) {
      if (el.id) return '#' + el.id;
      if (el.className) return '.' + Array.from(el.classList).join('.');
      return el.tagName.toLowerCase();
    }
  </script>
</body>
</html>
