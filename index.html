<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tempsms OTP Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-start p-4 sm:p-8">

    <div class="w-full max-w-4xl bg-slate-900 border border-slate-800 rounded-2xl shadow-xl p-6 sm:p-8">
        <header class="flex flex-col sm:flex-row items-center justify-between pb-6 border-b border-slate-800 gap-4">
            <div>
                <h1 class="text-2xl font-bold tracking-tight text-white">SMS OTP Lookup</h1>
                <p class="text-sm text-slate-400 mt-1">Search messages received by your numbers in real time.</p>
            </div>
            <div class="flex items-center gap-2">
                <span class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-medium bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
                    <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 mr-1.5 animate-pulse"></span>
                    API Connected
                </span>
            </div>
        </header>

        <!-- Search Bar -->
        <div class="mt-6 flex flex-col sm:flex-row gap-3">
            <div class="relative flex-1">
                <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 pointer-events-none text-slate-400">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                </span>
                <input type="text" id="searchInput" placeholder="Enter phone number (e.g., 249...)" 
                    class="w-full pl-10 pr-4 py-3 bg-slate-950 border border-slate-800 rounded-xl text-sm text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition">
            </div>
            <button onclick="fetchMessages()" id="searchBtn"
                class="px-6 py-3 bg-indigo-600 hover:bg-indigo-500 active:bg-indigo-700 text-white font-medium text-sm rounded-xl transition shadow-lg shadow-indigo-600/20 flex items-center justify-center gap-2">
                <span>Search</span>
            </button>
        </div>

        <!-- Results Section -->
        <div class="mt-8">
            <div id="loading" class="hidden text-center py-12 text-slate-400 text-sm">Searching messages...</div>
            <div id="error" class="hidden p-4 mb-4 rounded-xl bg-red-500/10 border border-red-500/20 text-red-400 text-sm"></div>
            
            <div id="resultsContainer" class="space-y-4">
                <!-- Dynamic cards will appear here -->
            </div>

            <div id="emptyState" class="text-center py-16 border border-dashed border-slate-800 rounded-2xl">
                <p class="text-sm text-slate-500">Enter a number above to check for incoming OTP messages.</p>
            </div>
        </div>
    </div>

    <script>
        const API_TOKEN = "0ZPuP0sLnqHaEIEkupNlnzobAuPFwTURrpr0XBjScUo";
        // Using a CORS proxy if necessary, or direct if supported. Since it's a direct backend endpoint, let's use a standard fetch or reliable CORS setup.
        // If the backend restricts direct browser fetch due to CORS, you can route through a Vercel serverless function or use standard cors proxy.
        // Given standard browser direct fetch:
        const BASE_URL = "http://187.53.137.91/ints/api/v1/messages";

        async function fetchMessages() {
            const number = document.getElementById('searchInput').value.trim();
            const resultsContainer = document.getElementById('resultsContainer');
            const loading = document.getElementById('loading');
            const errorDiv = document.getElementById('error');
            const emptyState = document.getElementById('emptyState');

            resultsContainer.innerHTML = '';
            errorDiv.classList.add('hidden');

            if (!number) {
                errorDiv.textContent = "Please enter a phone number to search.";
                errorDiv.classList.remove('hidden');
                return;
            }

            loading.classList.remove('hidden');
            emptyState.classList.add('hidden');

            try {
                // Fetching messages filtered by number
                const response = await fetch(`${BASE_URL}?token=${API_TOKEN}&number=${encodeURIComponent(number)}`, {
                    headers: {
                        'Accept': 'application/json'
                    }
                });

                if (!response.ok) {
                    throw new Error(`Server returned status ${response.status}`);
                }

                const data = await response.json();
                loading.classList.add('hidden');

                // Handle data array or object wrapper depending on exact API output format
                const messages = Array.isArray(data) ? data : (data.data || data.messages || []);

                if (messages.length === 0) {
                    emptyState.textContent = "No messages found for this number.";
                    emptyState.classList.remove('hidden');
                    return;
                }

                messages.forEach(msg => {
                    const fullText = msg.text || msg.message || msg.body || JSON.stringify(msg);
                    // Extract potential OTP code (4 to 6 digit numbers)
                    const otpMatch = fullText.match(/\b\d{4,6}\b/);
                    const otpCode = otpMatch ? otpMatch[0] : "N/A";

                    const card = document.createElement('div');
                    card.className = "bg-slate-950 border border-slate-800 rounded-xl p-5 flex flex-col gap-4 transition hover:border-slate-700";
                    
                    card.innerHTML = `
                        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2 text-xs text-slate-400 border-b border-slate-800/60 pb-3">
                            <div><strong class="text-slate-300">Number:</strong> ${msg.number || number}</div>
                            <div><strong class="text-slate-300">Sender (CLI):</strong> ${msg.cli || 'Unknown'}</div>
                            <div><strong class="text-slate-300">Time:</strong> ${msg.created_at || msg.date || 'Recent'}</div>
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 items-center">
                            <!-- Full Message Box -->
                            <div class="flex flex-col gap-1.5">
                                <span class="text-xs font-medium text-slate-400">Full Message</span>
                                <div class="flex items-center justify-between bg-slate-900 border border-slate-800 rounded-lg p-3 text-sm text-slate-200">
                                    <span class="truncate mr-2 font-mono">${escapeHtml(fullText)}</span>
                                    <button onclick="copyText(this, \`${escapeQuotes(fullText)}\`)" 
                                        class="shrink-0 px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-medium rounded-md transition">
                                        Copy Message
                                    </button>
                                </div>
                            </div>

                            <!-- OTP Code Box -->
                            <div class="flex flex-col gap-1.5">
                                <span class="text-xs font-medium text-slate-400">Extracted OTP Code</span>
                                <div class="flex items-center justify-between bg-indigo-950/30 border border-indigo-500/30 rounded-lg p-3 text-sm text-indigo-300 font-bold">
                                    <span class="font-mono text-base tracking-wider">${otpCode}</span>
                                    <button onclick="copyText(this, '${otpCode}')" 
                                        class="shrink-0 px-3 py-1.5 bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-medium rounded-md transition shadow">
                                        Copy Code
                                    </button>
                                </div>
                            </div>
                        </div>
                    `;
                    resultsContainer.appendChild(card);
                });

            } catch (err) {
                loading.classList.add('hidden');
                errorDiv.textContent = "Failed to fetch messages. Check network or CORS settings. (" + err.message + ")";
                errorDiv.classList.remove('hidden');
            }
        }

        function copyText(button, text) {
            navigator.clipboard.writeText(text).then(() => {
                const originalText = button.textContent;
                button.textContent = "Copied!";
                button.classList.add('bg-emerald-600', 'text-white');
                setTimeout(() => {
                    button.textContent = originalText;
                    button.classList.remove('bg-emerald-600', 'text-white');
                }, 2000);
            });
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        function escapeQuotes(str) {
            return str.replace(/['"`]/g, '');
        }
    </script>
</body>
</html>
