<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STEX SMS Portal Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .toggle-checkbox:checked { right: 0; border-color: #6366f1; }
        .toggle-checkbox:checked + .toggle-label { background-color: #6366f1; }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 min-h-screen font-sans pb-12">

    <!-- Top Navigation -->
    <div class="bg-white border-b shadow-sm sticky top-0 z-50 px-4 py-2.5">
        <div class="container mx-auto flex justify-between items-center max-w-xl">
            <div class="flex items-center gap-2">
                <span class="bg-indigo-600 text-white font-black px-2.5 py-1 rounded-lg text-xs">STEX</span>
                <span class="text-xs font-bold text-gray-700">SMS Portal 
                    <span id="liveIndicator" class="text-[10px] text-emerald-500 font-normal">● Live Listening</span>
                </span>
            </div>

            <div class="flex items-center gap-2 relative">
                <div class="flex items-center gap-1.5 bg-gray-50 border border-gray-200 px-2.5 py-1 rounded-xl">
                    <span class="text-[10px] font-bold text-gray-600">Auto-Refresh</span>
                    <label class="relative inline-flex items-center cursor-pointer">
                        <input type="checkbox" id="autoRefreshToggle" checked onchange="toggleAutoRefresh(this)" class="sr-only peer">
                        <div class="w-7 h-4 bg-gray-300 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-3 after:w-3 after:transition-all peer-checked:bg-emerald-600"></div>
                    </label>
                </div>

                <button onclick="exportMainToExcel()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-1.5 shadow transition">
                    <i class="fa-solid fa-file-excel"></i> এক্সেল
                </button>

                <div class="relative">
                    <button onclick="toggleMenu(event)" class="w-8 h-8 rounded-lg hover:bg-gray-100 flex items-center justify-center text-gray-600 transition">
                        <i class="fa-solid fa-ellipsis-vertical text-base"></i>
                    </button>

                    <div id="dropdownMenu" class="hidden absolute right-0 mt-2 w-64 bg-white rounded-2xl shadow-xl border border-gray-100 py-2 z-50 text-xs font-medium">
                        <button onclick="openGlobalConsoleModal()" class="w-full text-left px-4 py-2.5 hover:bg-indigo-50 hover:text-indigo-600 flex items-center gap-2.5 transition">
                            <i class="fa-solid fa-globe text-indigo-500 w-4"></i> Global Live Console
                        </button>
                        <button onclick="openSuccessOtpsModal()" class="w-full text-left px-4 py-2.5 hover:bg-emerald-50 hover:text-emerald-600 flex items-center gap-2.5 transition">
                            <i class="fa-solid fa-shield-halved text-emerald-500 w-4"></i> Permanent Success OTPs
                        </button>
                        <button onclick="openConsoleHistoryModal()" class="w-full text-left px-4 py-2.5 hover:bg-blue-50 hover:text-blue-600 flex items-center gap-2.5 transition">
                            <i class="fa-solid fa-clock-rotate-left text-blue-500 w-4"></i> Console History
                        </button>
                        <div class="border-t border-gray-100 my-1"></div>
                        <button onclick="clearLocalStorageData()" class="w-full text-left px-4 py-2.5 hover:bg-red-50 text-red-600 flex items-center gap-2.5 transition">
                            <i class="fa-solid fa-trash-can w-4"></i> Reset Local Storage
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="container mx-auto p-4 max-w-xl space-y-6">
        
        <!-- Number Range & Bulk Generator -->
        <div class="bg-white p-5 rounded-3xl shadow-sm border border-gray-200">
            <h2 class="text-sm font-bold text-gray-700 mb-3 tracking-wide">Number Range & Bulk Generator</h2>
            
            <div class="flex gap-2 mb-4">
                <input type="text" id="pinInput" placeholder="26134 (No XXX)" oninput="saveRangeInput(this.value)" class="flex-1 bg-white border border-gray-300 rounded-2xl px-4 py-3 text-gray-800 font-medium placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
                <div class="w-20 relative" title="একসাথে কয়টি নাম্বার নিতে চান (১-১০০)">
                    <span class="absolute -top-2 left-3 bg-white px-1 text-[10px] font-bold text-indigo-600">Qty [ ]</span>
                    <input type="number" id="bulkQtyInput" value="1" min="1" max="100" class="w-full h-full bg-white border border-indigo-300 rounded-2xl px-3 text-center text-indigo-700 font-bold text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
            </div>

            <div class="flex items-center justify-between mb-5 px-1">
                <label class="flex items-center cursor-pointer gap-2 select-none">
                    <div class="relative">
                        <input type="checkbox" id="nationalToggle" class="sr-only toggle-checkbox">
                        <div class="block bg-gray-300 w-10 h-6 rounded-full toggle-label transition"></div>
                    </div>
                    <span class="text-xs font-medium text-gray-600">National</span>
                </label>

                <label class="flex items-center cursor-pointer gap-2 select-none">
                    <div class="relative">
                        <input type="checkbox" id="removePlusToggle" class="sr-only toggle-checkbox">
                        <div class="block bg-gray-300 w-10 h-6 rounded-full toggle-label transition"></div>
                    </div>
                    <span class="text-xs font-medium text-gray-600">Remove Plus</span>
                </label>
            </div>

            <div class="flex items-center gap-3">
                <div class="border border-gray-300 rounded-2xl p-3 flex items-center justify-center text-gray-600">
                    <i class="fa-solid fa-mobile-screen text-lg"></i>
                </div>
                <button onclick="fetchNumber()" class="flex-1 bg-[#6366f1] hover:bg-[#4f46e5] text-white font-semibold py-3 px-6 rounded-2xl shadow-lg shadow-indigo-500/25 transition text-sm flex justify-center items-center gap-2">
                    <i class="fa-solid fa-paper-plane text-xs"></i> Get Numbers
                </button>
            </div>
        </div>

        <!-- Numbers List Container -->
        <div class="bg-white rounded-3xl shadow-sm border border-gray-200 overflow-hidden">
            <div class="grid grid-cols-3 p-4 border-b border-gray-100 text-[11px] font-bold text-gray-400 uppercase tracking-wider text-center">
                <div class="text-left flex items-center gap-1.5"><i class="fa-solid fa-mobile-screen"></i> Phone Number</div>
                <div><i class="fa-solid fa-globe"></i> Country</div>
                <div class="text-right"><i class="fa-regular fa-clock"></i> Last Activity</div>
            </div>

            <div id="cardsContainer" class="divide-y divide-gray-100"></div>
        </div>

    </div>

    <!-- MODALS -->
    <div id="globalConsoleModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm hidden z-50 flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-lg rounded-3xl shadow-2xl overflow-hidden flex flex-col max-h-[80vh]">
            <div class="p-4 bg-indigo-600 text-white flex justify-between items-center font-bold text-sm">
                <span><i class="fa-solid fa-globe mr-2"></i> Global Live Console</span>
                <button onclick="closeModal('globalConsoleModal')" class="text-white text-lg">&times;</button>
            </div>
            <div id="globalConsoleBody" class="p-4 overflow-y-auto space-y-3 text-xs divide-y divide-gray-100"></div>
        </div>
    </div>

    <div id="successOtpsModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm hidden z-50 flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-lg rounded-3xl shadow-2xl overflow-hidden flex flex-col max-h-[85vh]">
            <div class="p-4 bg-emerald-600 text-white flex justify-between items-center font-bold text-sm">
                <span><i class="fa-solid fa-shield-halved mr-2"></i> Permanent Success OTPs</span>
                <button onclick="closeModal('successOtpsModal')" class="text-white text-lg">&times;</button>
            </div>
            
            <div class="bg-emerald-50 px-4 py-3 border-b border-emerald-100 flex items-center justify-between gap-2">
                <div class="flex items-center gap-2">
                    <span class="text-[11px] font-bold text-emerald-800">তারিখ:</span>
                    <input type="date" id="filterDateInput" onchange="renderSuccessOtpsModalList()" class="bg-white border border-emerald-300 rounded-xl px-2.5 py-1 text-xs font-medium text-emerald-900 focus:outline-none shadow-sm">
                    <button onclick="resetSuccessFilters()" class="text-xs text-emerald-700 hover:text-emerald-900 font-semibold px-2.5 py-1 bg-emerald-200/60 rounded-xl">রিসেট</button>
                </div>
                
                <button onclick="exportFilteredSuccessOtpsToExcel()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-3.5 py-1.5 rounded-xl text-xs font-bold shadow flex items-center gap-1.5">
                    <i class="fa-solid fa-file-excel"></i> এক্সেল
                </button>
            </div>

            <div id="successOtpsBody" class="p-4 overflow-y-auto space-y-3 text-xs divide-y divide-gray-100"></div>
        </div>
    </div>

    <div id="consoleHistoryModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm hidden z-50 flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-lg rounded-3xl shadow-2xl overflow-hidden flex flex-col max-h-[80vh]">
            <div class="p-4 bg-blue-600 text-white flex justify-between items-center font-bold text-sm">
                <span><i class="fa-solid fa-clock-rotate-left mr-2"></i> Console History</span>
                <div class="flex items-center gap-3">
                    <button onclick="exportHistoryToExcel()" class="bg-white text-blue-700 px-2.5 py-1 rounded-lg text-xs font-bold shadow">এক্সেল</button>
                    <button onclick="closeModal('consoleHistoryModal')" class="text-white text-lg">&times;</button>
                </div>
            </div>
            <div id="consoleHistoryBody" class="p-4 overflow-y-auto space-y-3 text-xs divide-y divide-gray-100"></div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-gray-900/90 text-white px-5 py-3 rounded-2xl shadow-2xl text-xs font-medium tracking-wide flex items-center gap-3 opacity-0 pointer-events-none transition-all duration-300 z-50 backdrop-blur">
        <div class="bg-emerald-500 text-white rounded-full w-5 h-5 flex items-center justify-center text-[10px]">
            <i class="fa-solid fa-check"></i>
        </div>
        <span id="toastText">Copied to clipboard.</span>
    </div>

    <script>
        const API_BASE = "https://api.2oo9.cloud/MXS47FLFX0U/tness/@public/api";
        const API_KEY = "M8OSXY9XKQ3";
        let refreshInterval = null;

        document.addEventListener("DOMContentLoaded", () => {
            let savedRange = localStorage.getItem('stex_saved_range') || '';
            if(savedRange) {
                document.getElementById('pinInput').value = savedRange;
            }

            // লোকাল টাইম অনুযায়ী আজকের তারিখ ডিফল্টভাবে সেট করা (YYYY-MM-DD ফরম্যাট)
            let now = new Date();
            let todayStr = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
            let dateInput = document.getElementById('filterDateInput');
            if(dateInput && !dateInput.value) {
                dateInput.value = todayStr;
            }

            loadCards();
            startMultiListenerLoop();

            window.addEventListener('click', (e) => {
                let menu = document.getElementById('dropdownMenu');
                if(!e.target.closest('button')) {
                    menu.classList.add('hidden');
                }
            });
        });

        function toggleAutoRefresh(checkbox) {
            let indicator = document.getElementById('liveIndicator');
            if(checkbox.checked) {
                startMultiListenerLoop();
                indicator.className = "text-[10px] text-emerald-500 font-normal";
                indicator.innerText = "● Live Listening";
                showToast("Auto-Refresh Enabled");
            } else {
                if(refreshInterval) clearInterval(refreshInterval);
                indicator.className = "text-[10px] text-rose-500 font-normal";
                indicator.innerText = "● Paused";
                showToast("Auto-Refresh Paused");
            }
        }

        function startMultiListenerLoop() {
            if(refreshInterval) clearInterval(refreshInterval);
            refreshInterval = setInterval(() => {
                if(document.getElementById('autoRefreshToggle').checked) {
                    fetchAllBackgroundAPIsParallel();
                }
            }, 3000);
        }

        function toggleMenu(event) {
            event.stopPropagation();
            let menu = document.getElementById('dropdownMenu');
            menu.classList.toggle('hidden');
        }

        function closeModal(modalId) {
            document.getElementById(modalId).classList.add('hidden');
        }

        function saveRangeInput(val) {
            localStorage.setItem('stex_saved_range', val);
        }

        function extractOtpCode(message) {
            if (!message || message.includes("Waiting")) return "---";
            let match = message.match(/\b\d{4,8}\b/);
            return match ? match[0] : message;
        }

        function getFormattedNumberForCopy(apiFullNumber, nationalNumber) {
            let num = apiFullNumber || '';
            if(document.getElementById('nationalToggle').checked) {
                num = nationalNumber || num;
            }
            if(document.getElementById('removePlusToggle').checked) {
                num = num.replace(/^\+/, '');
            }
            return num;
        }

        async function fetchNumber() {
            let pinInputVal = document.getElementById('pinInput').value.trim();
            let qty = parseInt(document.getElementById('bulkQtyInput').value) || 1;
            if (!pinInputVal) {
                showToast("দয়া করে রেঞ্জ আইডি দিন (যেমন: 26134)");
                return;
            }
            let rid = pinInputVal.replace(/XXX/gi, "").trim();
            qty = Math.min(Math.max(qty, 1), 100);

            let allFetchedNumbersForCopy = [];
            showToast(`Fetching ${qty} numbers...`);

            for (let i = 0; i < qty; i++) {
                try {
                    let response = await fetch(`${API_BASE}/getnum`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', 'mauthapi': API_KEY },
                        body: JSON.stringify({ rid: rid })
                    });
                    let result = await response.json();
                    
                    if (result.meta && result.meta.code === 200 && result.data) {
                        let apiFullNumber = String(result.data.full_number || '').trim();
                        let nationalNum = String(result.data.national_number || '').trim();
                        
                        let cleanNumDigits = apiFullNumber.replace(/\D/g, '');
                        let copyFormatNum = getFormattedNumberForCopy(apiFullNumber, nationalNum);
                        allFetchedNumbersForCopy.push(copyFormatNum);

                        let displayWithPlus = apiFullNumber;
                        if (!displayWithPlus.startsWith('+')) {
                            displayWithPlus = '+' + displayWithPlus;
                        }

                        const dataObj = {
                            id: 'item_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5),
                            time: new Date().toLocaleTimeString(),
                            display_number: displayWithPlus,
                            raw_api_number: apiFullNumber,
                            national_number: nationalNum,
                            digits: cleanNumDigits,
                            country: (result.data.country || 'UNKNOWN').toUpperCase(),
                            message: 'Waiting for OTP...',
                            otpsList: [], 
                            processedMessages: [] 
                        };

                        saveToLocalStorageDirect('stex_exact_data', dataObj);
                    }
                } catch (error) {
                    console.error("Fetch loop error", error);
                }
            }

            loadCards();

            if(allFetchedNumbersForCopy.length > 0) {
                let combinedText = allFetchedNumbersForCopy.join('\n');
                copyToClipboard(combinedText);
                showToast(`${allFetchedNumbersForCopy.length} numbers fetched & copied!`);
            } else {
                showToast("No numbers available or out of stock!");
            }
        }

        async function fetchAllBackgroundAPIsParallel() {
            try {
                let [resOtp, resConsole] = await Promise.all([
                    fetch(`${API_BASE}/success-otp`, { headers: { 'mauthapi': API_KEY } }).then(r => r.json()).catch(() => null),
                    fetch(`${API_BASE}/console`, { headers: { 'mauthapi': API_KEY } }).then(r => r.json()).catch(() => null)
                ]);

                let updated = false;
                let savedData = JSON.parse(localStorage.getItem('stex_exact_data')) || [];
                let permanentSuccess = JSON.parse(localStorage.getItem('stex_permanent_success_otps')) || [];
                let history = JSON.parse(localStorage.getItem('stex_console_history')) || [];

                if(resConsole && resConsole.meta?.code === 200 && resConsole.data?.hits) {
                    resConsole.data.hits.forEach(hit => {
                        let hitObj = {
                            range: hit.range || 'N/A',
                            platform: hit.sid || 'SMS',
                            message: hit.message || 'N/A',
                            full_date: new Date(hit.time || Date.now()).toLocaleString()
                        };
                        let exists = history.some(h => h.full_date === hitObj.full_date && h.message === hitObj.message);
                        if(!exists) {
                            history.unshift(hitObj);
                            updated = true;
                        }
                    });
                }

                let otpsArray = resOtp?.data?.otps || [];
                if(resOtp && resOtp.meta?.code === 200 && otpsArray.length > 0) {
                    otpsArray.forEach(item => {
                        let itemNumRaw = String(item.number || '').trim();
                        let itemNumDigits = itemNumRaw.replace(/\D/g, '');
                        let msg = item.message || '';
                        let otpCode = extractOtpCode(msg);
                        let timeMs = item.time || Date.now();
                        
                        let dateObj = new Date(timeMs);
                        let localYear = dateObj.getFullYear();
                        let localMonth = String(dateObj.getMonth() + 1).padStart(2, '0');
                        let localDay = String(dateObj.getDate()).padStart(2, '0');
                        let rawDateStr = `${localYear}-${localMonth}-${localDay}`; // লোকাল টাইম অনুযায়ী সঠিক YYYY-MM-DD
                        let timeStr = dateObj.toLocaleTimeString();

                        if(otpCode && otpCode !== "---") {
                            let successEntry = {
                                otp_id: item.otp_id || (itemNumRaw + timeMs),
                                number: itemNumRaw,
                                otp: otpCode,
                                platform: 'SMS',
                                message: msg,
                                raw_date: rawDateStr,
                                date: dateObj.toLocaleDateString(),
                                time: timeStr,
                                timeMs: timeMs
                            };

                            let alreadyExists = permanentSuccess.some(p => p.otp_id === successEntry.otp_id || (p.number === successEntry.number && p.message === successEntry.message));
                            if(!alreadyExists) {
                                permanentSuccess.unshift(successEntry);
                                updated = true;
                            }
                        }

                        savedData.forEach(card => {
                            let cardDigits = card.digits || card.raw_api_number.replace(/\D/g, '');
                            
                            let isMatched = false;
                            if(itemNumDigits === cardDigits) isMatched = true;
                            else if(itemNumDigits.length >= 6 && cardDigits.length >= 6 && (itemNumDigits.endsWith(cardDigits) || cardDigits.endsWith(itemNumDigits))) isMatched = true;

                            if(isMatched) {
                                if(msg && !card.processedMessages.includes(msg)) {
                                    card.message = msg;
                                    card.processedMessages.push(msg);
                                    card.time = timeStr;
                                    
                                    let extracted = extractOtpCode(msg);
                                    if(extracted !== "---") {
                                        let otpAlreadyInCard = card.otpsList.some(o => o.otp === extracted);
                                        if(!otpAlreadyInCard) {
                                            card.otpsList.push({
                                                otp: extracted,
                                                platform: 'SMS',
                                                time: card.time
                                            });
                                            copyToClipboard(extracted);
                                            showToast(`OTP Received: ${extracted}`);
                                        }
                                    }
                                    updated = true;
                                }
                            }
                        });
                    });
                }

                if(updated) {
                    localStorage.setItem('stex_exact_data', JSON.stringify(savedData));
                    localStorage.setItem('stex_permanent_success_otps', JSON.stringify(permanentSuccess));
                    localStorage.setItem('stex_console_history', JSON.stringify(history));
                    loadCards();
                }

            } catch (err) {
                console.error("Background sync error:", err);
            }
        }

        function saveToLocalStorageDirect(key, obj) {
            let data = JSON.parse(localStorage.getItem(key)) || [];
            data.unshift(obj);
            localStorage.setItem(key, JSON.stringify(data));
        }

        function loadCards() {
            let container = document.getElementById('cardsContainer');
            let savedData = JSON.parse(localStorage.getItem('stex_exact_data')) || [];

            if(savedData.length === 0) {
                container.innerHTML = `
                    <div class="p-8 text-center text-gray-400 text-xs">
                        কোনো নাম্বার জেনারেট করা হয়নি। উপরে রেঞ্জ আইডি দিয়ে 'Get Numbers' এ ক্লিক করুন।
                    </div>
                `;
                return;
            }

            container.innerHTML = '';
            savedData.forEach(card => {
                let div = document.createElement('div');
                div.className = "grid grid-cols-3 p-4 items-center text-xs hover:bg-gray-50 transition";
                
                let copyNum = getFormattedNumberForCopy(card.raw_api_number, card.national_number);

                let otpsHtml = '';
                if(card.otpsList && card.otpsList.length > 0) {
                    otpsHtml = `<div class="flex flex-wrap gap-1 mt-1">`;
                    card.otpsList.forEach(o => {
                        otpsHtml += `<span onclick="copyToClipboard('${o.otp}')" class="bg-emerald-100 text-emerald-800 font-bold px-1.5 py-0.5 rounded text-[11px] cursor-pointer" title="Copy OTP">OTP: ${o.otp}</span>`;
                    });
                    otpsHtml += `</div>`;
                } else if(card.message && !card.message.includes("Waiting")) {
                    let singleOtp = extractOtpCode(card.message);
                    if(singleOtp !== "---") {
                        otpsHtml = `<div class="mt-1"><span onclick="copyToClipboard('${singleOtp}')" class="bg-emerald-100 text-emerald-800 font-bold px-1.5 py-0.5 rounded text-[11px] cursor-pointer">OTP: ${singleOtp}</span></div>`;
                    }
                }

                div.innerHTML = `
                    <div class="text-left">
                        <div onclick="copyToClipboard('${copyNum}')" class="font-bold text-indigo-600 cursor-pointer hover:underline text-sm flex items-center gap-1.5">
                            ${card.display_number} <i class="fa-regular fa-copy text-[10px] text-gray-400"></i>
                        </div>
                        <div class="text-[11px] text-gray-500 truncate max-w-[150px]" title="${card.message}">${card.message}</div>
                        ${otpsHtml}
                    </div>
                    <div class="text-center font-medium text-gray-600">${card.country}</div>
                    <div class="text-right text-gray-400 text-[11px]">${card.time}</div>
                `;
                container.appendChild(div);
            });
        }

        function openSuccessOtpsModal() {
            document.getElementById('successOtpsModal').classList.remove('hidden');
            renderSuccessOtpsModalList();
        }

        function renderSuccessOtpsModalList() {
            let body = document.getElementById('successOtpsBody');
            let successData = JSON.parse(localStorage.getItem('stex_permanent_success_otps')) || [];
            let selectedDate = document.getElementById('filterDateInput').value;

            let filtered = successData.filter(item => {
                if (!item.otp || item.otp.trim() === "" || item.otp === "---") return false;

                if(selectedDate) {
                    let itemDate = item.raw_date;
                    if(!itemDate && item.timeMs) {
                        let d = new Date(item.timeMs);
                        itemDate = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
                    }
                    if(itemDate && itemDate !== selectedDate) return false;
                }
                return true;
            });

            if(filtered.length === 0) {
                body.innerHTML = `<div class="text-center text-gray-400 py-6">কোনো সফল OTP রেকর্ড পাওয়া যায়নি।</div>`;
                return;
            }

            body.innerHTML = '';
            filtered.forEach(item => {
                let div = document.createElement('div');
                div.className = "py-3 flex justify-between items-center border-b border-gray-100 last:border-0";
                
                div.innerHTML = `
                    <div class="pr-2">
                        <div class="flex items-center gap-2">
                            <span class="font-bold text-gray-800">+${item.number}</span>
                        </div>
                        <div class="text-gray-600 text-[11px] mt-0.5 break-all" title="${item.message}">${item.message}</div>
                        <div class="text-[10px] text-gray-400 mt-0.5">${item.date || ''} ${item.time || ''}</div>
                    </div>
                    <div class="flex items-center gap-1.5 shrink-0">
                        <button onclick="copyToClipboard('${item.otp}')" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-3 py-1.5 rounded-xl text-xs shadow-sm flex items-center gap-1">
                            ${item.otp} <i class="fa-regular fa-copy"></i>
                        </button>
                    </div>
                `;
                body.appendChild(div);
            });
        }

        function resetSuccessFilters() {
            let now = new Date();
            let todayStr = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
            document.getElementById('filterDateInput').value = todayStr;
            renderSuccessOtpsModalList();
        }

        function exportFilteredSuccessOtpsToExcel() {
            let successData = JSON.parse(localStorage.getItem('stex_permanent_success_otps')) || [];
            if(successData.length === 0) {
                showToast("কোনো ডেটা নেই!");
                return;
            }
            let ws = XLSX.utils.json_to_sheet(successData);
            let wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Success_OTPs");
            XLSX.writeFile(wb, "Permanent_Success_OTPs.xlsx");
            showToast("Success OTPs Excel Downloaded!");
        }

        function openGlobalConsoleModal() {
            document.getElementById('globalConsoleModal').classList.remove('hidden');
            let body = document.getElementById('globalConsoleBody');
            let history = JSON.parse(localStorage.getItem('stex_console_history')) || [];
            
            if(history.length === 0) {
                body.innerHTML = `<div class="text-center text-gray-400 py-6">কোনো কনসোল ডাটা নেই।</div>`;
                return;
            }

            body.innerHTML = '';
            history.forEach(h => {
                let div = document.createElement('div');
                div.className = "py-2";
                div.innerHTML = `
                    <div class="flex justify-between font-bold text-indigo-600">
                        <span>Range: ${h.range}</span>
                        <span class="text-gray-400 text-[10px]">${h.full_date}</span>
                    </div>
                    <div class="text-gray-500 text-[11px]">${h.message}</div>
                `;
                body.appendChild(div);
            });
        }

        function openConsoleHistoryModal() {
            document.getElementById('consoleHistoryModal').classList.remove('hidden');
            let body = document.getElementById('consoleHistoryBody');
            let history = JSON.parse(localStorage.getItem('stex_console_history')) || [];

            if(history.length === 0) {
                body.innerHTML = `<div class="text-center text-gray-400 py-6">কোনো হিস্ট্রি ডাটা নেই।</div>`;
                return;
            }

            body.innerHTML = '';
            history.forEach(h => {
                let div = document.createElement('div');
                div.className = "py-2";
                div.innerHTML = `
                    <div class="flex justify-between font-bold text-blue-600">
                        <span>Range: ${h.range}</span>
                        <span class="text-gray-400 text-[10px]">${h.full_date}</span>
                    </div>
                    <div class="text-gray-500 text-[11px]">${h.message}</div>
                `;
                body.appendChild(div);
            });
        }

        function exportHistoryToExcel() {
            let history = JSON.parse(localStorage.getItem('stex_console_history')) || [];
            if(history.length === 0) {
                showToast("কোনো হিস্ট্রি নেই!");
                return;
            }
            let ws = XLSX.utils.json_to_sheet(history);
            let wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "History");
            XLSX.writeFile(wb, "Console_History.xlsx");
            showToast("History Excel Downloaded!");
        }

        function exportMainToExcel() {
            let savedData = JSON.parse(localStorage.getItem('stex_exact_data')) || [];
            if(savedData.length === 0) {
                showToast("এক্সপোর্ট করার মতো কোনো নাম্বার নেই!");
                return;
            }
            let ws = XLSX.utils.json_to_sheet(savedData);
            let wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Generated_Numbers");
            XLSX.writeFile(wb, "STEX_Numbers_List.xlsx");
            showToast("Main Data Excel Downloaded!");
        }

        function clearLocalStorageData() {
            if(confirm("আপনি কি নিশ্চিত সব লোকাল স্টোরেজ রিসেট করতে চান?")) {
                localStorage.clear();
                loadCards();
                showToast("Local Storage Reset Successfully");
                document.getElementById('dropdownMenu').classList.add('hidden');
            }
        }

        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(() => {
                showToast(`Copied to clipboard`);
            }).catch(err => {
                console.error('Failed to copy: ', err);
            });
        }

        function showToast(message) {
            let toast = document.getElementById('toast');
            let toastText = document.getElementById('toastText');
            toastText.innerText = message;
            toast.classList.remove('opacity-0', 'pointer-events-none');
            toast.classList.add('opacity-100');
            setTimeout(() => {
                toast.classList.remove('opacity-100');
                toast.classList.add('opacity-0', 'pointer-events-none');
            }, 2500);
        }
    </script>
</body>
</html>
