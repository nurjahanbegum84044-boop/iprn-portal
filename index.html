<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TaskHub – Small jobs, done and paid</title>
<style>@media(max-width:480px){.nav .btn{padding:9px 12px;font-size:13px}.nav .tag{display:none}}
:root{--bg:#f9f9f9;--card:#fff;--ink:#05060f;--mut:#6b6b6b;--line:#e3e3e8;--pill:#f1f1f1;--p:#ff7300;--p2:#f94f0a;--ok:#12b76a;--bad:#e5251b;--sh:0 6px 24px rgba(0,0,0,.06);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c0c0f;--card:#17171c;--ink:#f5f5f7;--mut:#a0a0aa;--line:#2a2a32;--pill:#1e1e24;--sh:0 8px 30px rgba(0,0,0,.4)}}
:root[data-theme="dark"]{--bg:#0c0c0f;--card:#17171c;--ink:#f5f5f7;--mut:#a0a0aa;--line:#2a2a32;--pill:#1e1e24;--sh:0 8px 30px rgba(0,0,0,.4)}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.w{max-width:1100px;margin:auto;padding:0 18px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;padding:12px 0 0}
.nav{display:flex;align-items:center;gap:10px;height:62px;background:var(--pill);border-radius:99px;padding:0 12px 0 20px;flex-wrap:nowrap}.logo{font-weight:800;font-size:20px;display:flex;gap:8px;align-items:center;cursor:pointer}
.logo i{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--p),var(--p2));display:grid;place-items:center;color:#fff;font-style:normal}
.sp{flex:1}.btn{border:0;border-radius:14px;padding:12px 20px;font:700 15px inherit;font-family:inherit;cursor:pointer;background:var(--p);color:#fff;transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(255,115,0,.35)}.btn.g{background:var(--pill);color:var(--ink);border:0}.btn.ok{background:var(--ok)}.btn.bad{background:var(--bad)}.btn.s{padding:7px 12px;font-size:13px}
.hero{padding:70px 0 40px;text-align:center}.hero h1{font-size:clamp(38px,7vw,68px);line-height:1.04;margin:0 0 16px;letter-spacing:-2.5px;font-weight:800}
.hero h1 b{color:var(--p)}
.hero p{color:var(--mut);max-width:560px;margin:0 auto 24px;font-size:17px}.badge{display:inline-block;background:color-mix(in srgb,var(--p) 12%,transparent);color:var(--p);padding:5px 12px;border-radius:99px;font-weight:600;font-size:13px;margin-bottom:16px}
.row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}.hero .row .btn{flex:1 1 240px;max-width:340px;padding:17px 20px;font-size:16px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin:34px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:var(--sh)}
.stat b{font-size:28px;display:block;letter-spacing:-.5px}.stat span{color:var(--mut);font-size:13px}
h2{font-size:clamp(24px,4vw,34px);letter-spacing:-.8px;margin:50px 0 8px;text-align:center}.sub{text-align:center;color:var(--mut);margin:0 0 24px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.ic{width:44px;height:44px;border-radius:12px;background:color-mix(in srgb,var(--p) 12%,transparent);display:grid;place-items:center;font-size:21px;margin-bottom:10px}
.card h3{margin:0 0 6px;font-size:17px}.card p{margin:0;color:var(--mut)}
details{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 18px;margin-bottom:10px}summary{cursor:pointer;font-weight:600}details p{color:var(--mut);margin:8px 0 0}
footer{margin-top:60px;padding:28px 0;border-top:1px solid var(--line);color:var(--mut);text-align:center;font-size:13px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:20px 0;padding-bottom:4px}.tab{padding:9px 16px;border-radius:99px;border:1px solid var(--line);background:var(--card);cursor:pointer;white-space:nowrap;font-weight:600;font-size:14px;color:var(--mut)}.tab.on{background:var(--p);color:#fff;border-color:var(--p)}
.bal{background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;border-radius:24px;padding:24px;margin:20px 0}.bal b{font-size:36px;display:block;letter-spacing:-1px}
.tag{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600;background:color-mix(in srgb,var(--p) 12%,transparent);color:var(--p)}.tag.ok{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}.tag.bad{background:color-mix(in srgb,var(--bad) 15%,transparent);color:var(--bad)}
input,select,textarea{width:100%;padding:11px 13px;border-radius:11px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;margin:5px 0 12px}label{font-weight:600;font-size:13px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}.rw{font-weight:800;color:var(--ok)}
.md{position:fixed;inset:0;background:rgba(10,10,30,.55);display:none;place-items:center;z-index:50;padding:16px}.md.on{display:grid}.md>div{background:var(--card);border-radius:20px;padding:24px;max-width:460px;width:100%;max-height:90vh;overflow:auto}
.chatb{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:40;width:56px;height:56px;border-radius:50%;font-size:24px;padding:0}
.chat{position:fixed;right:16px;bottom:calc(82px + env(safe-area-inset-bottom,0px));width:min(360px,calc(100vw - 32px));height:460px;max-height:70vh;background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--sh);z-index:40;display:none;flex-direction:column;overflow:hidden}.chat.on{display:flex}
.ch{padding:14px 16px;background:var(--p);color:#fff;font-weight:700}#msgs{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.m{max-width:80%;padding:8px 12px;border-radius:14px;background:var(--bg);align-self:flex-start;position:relative}.m.me{background:var(--p);color:#fff;align-self:flex-end}.m img{max-width:100%;border-radius:10px;display:block;margin-top:4px}
.m small{display:block;opacity:.65;font-size:11px}.rx{position:absolute;bottom:-10px;right:6px;background:var(--card);border:1px solid var(--line);border-radius:99px;font-size:12px;padding:0 6px;color:var(--ink)}
.cf{display:flex;gap:6px;padding:10px;border-top:1px solid var(--line)}.cf input{margin:0}.cf .btn{padding:8px 12px}
.ems{display:none;gap:4px;position:absolute;top:-30px;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:3px 8px;box-shadow:var(--sh)}.m:hover .ems{display:flex}.ems span{cursor:pointer}
table{width:100%;border-collapse:collapse}td,th{padding:10px;border-bottom:1px solid var(--line);text-align:left;font-size:14px}.sc{overflow-x:auto}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:90px;background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:12px;z-index:60;display:none}
</style></head><body>
<header><div class="w nav"><div class="logo" onclick="go('home')"><i>✓</i>TaskHub</div><div class="sp"></div>
<span id="nr"></span></div></header>
<main class="w" id="app"></main>
<footer><div class="w">© 2026 TaskHub · <a href="#" onclick="adminM();return false" style="color:inherit">Admin</a></div></footer>
<button class="btn chatb" onclick="tc()" aria-label="Live chat">💬</button>
<div class="chat" id="chat"><div class="ch">Live Chat</div><div id="msgs"></div>
<div class="cf"><label class="btn g s" style="margin:0">📎<input type="file" accept="image/*" hidden onchange="sendImg(this)"></label><input id="ci" placeholder="Type a message…" onkeydown="if(event.key==='Enter')send()"><button class="btn" onclick="send()">➤</button></div></div>
<div class="md" id="md" onclick="if(event.target===this&&!V.lock)cm()"><div id="mb"></div></div><div class="toast" id="ts"></div>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let S={me:null,set:{cur:'₦',minWd:500,fee:0,pay:'',name:'TaskHub'},cats:[],tasks:[],subs:[],tx:[],wd:[],dep:[],chat:[]},V={view:'home',tab:'',cat:'All',q:'',lock:false};
const fmt=n=>S.set.cur+Number(n||0).toLocaleString();
const when=t=>new Date(t).toLocaleString([],{dateStyle:'medium',timeStyle:'short'});
const toast=m=>{const t=$('ts');t.textContent=m;t.style.display='block';clearTimeout(toast.i);toast.i=setTimeout(()=>t.style.display='none',2800)};
async function api(p,b){try{const r=await fetch('/api/'+p,b===undefined?{}:{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});const j=await r.json().catch(()=>({}));if(!r.ok){toast(j.error||'Something went wrong');return null}return j}catch(e){toast('Network error, try again');return null}}
async function load(go){const j=await api('state');if(j){S=j;if(go&&S.me){V.view='app';V.tab=S.me.admin?'ov':S.me.role==='worker'?'market':'post'}}render()}
function go(v){V.view=v;render();scrollTo(0,0)}
function cm(){$('md').classList.remove('on')}function om(h){$('mb').innerHTML=h;$('md').classList.add('on')}
const tag=s=>`<span class="tag ${['approved','paid','credited'].includes(s)?'ok':s==='rejected'?'bad':''}">${esc(s)}</span>`;
const tabs=a=>`<div class="tabs">${a.map(x=>`<div class="tab ${V.tab===x[0]?'on':''}" onclick="V.tab='${x[0]}';render()">${x[1]}</div>`).join('')}</div>`;
const val=id=>$(id).value.trim();
function authM(mode,role){mode=mode||'login';if(role)V.role=role;V.role=V.role||'worker';const t=(m,l)=>`<span class="tab ${mode===m?'on':''}" onclick="authM('${m}')">${l}</span>`;let f;
 if(mode==='signup')f=`<label>Username</label><input id="au" autocomplete="username" maxlength="20"><label>Password (min 8 characters)</label><input id="ap" type="password" autocomplete="new-password"><label>I want to</label><select id="ar"><option value="worker" ${V.role==='worker'?'selected':''}>Earn money (Worker)</option><option value="advertiser" ${V.role==='advertiser'?'selected':''}>Post jobs (Advertiser)</option></select><button class="btn" style="width:100%" onclick="doSignup()">Create account</button>`;
 else if(mode==='reset')f=`<p style="color:var(--mut);margin-top:0">Enter the secret key you saved at sign up. You can reset as many times as you need.</p><label>Username</label><input id="au" autocomplete="username"><label>Secret key</label><input id="ak" placeholder="XXXXXX-XXXXXX-XXXXXX-XXXXXX-XXXXXX"><label>New password (min 8 characters)</label><input id="ap" type="password" autocomplete="new-password"><button class="btn" style="width:100%" onclick="doReset()">Reset password</button>`;
 else f=`<label>Username</label><input id="au" autocomplete="username"><label>Password</label><input id="ap" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()"><button class="btn" style="width:100%" onclick="doLogin()">Log in</button>`;
 om(`<div class="tabs" style="margin-top:0">${t('login','Log in')}${t('signup','Sign up')}${t('reset','Forgot password')}</div>${f}`)}
async function doSignup(){const u=val('au'),p=$('ap').value,r=$('ar').value;V.role=r;const j=await api('signup',{username:u,password:p,role:r});if(j)keyM(j.key,u.toLowerCase())}
async function doLogin(){if(await api('login',{username:val('au'),password:$('ap').value})){cm();load(true)}}
async function doReset(){if(await api('reset',{username:val('au'),key:val('ak'),password:$('ap').value})){cm();toast('Password changed. You are logged in.');load(true)}}
function adminM(){om(`<h3 style="margin-top:0">Owner login</h3><label>Admin username</label><input id="au" autocomplete="username"><label>Password</label><input id="ap" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')doAdmin()"><button class="btn" style="width:100%" onclick="doAdmin()">Enter admin panel</button>`)}
async function doAdmin(){if(await api('admin/login',{u:val('au'),p:$('ap').value})){cm();load(true)}}
function keyM(k,un){S._k=k;V.lock=true;om(`<h3 style="margin-top:0">Save your secret key</h3><p style="color:var(--mut)">This key is the only way to reset your password. It is shown <b>once</b>, and you can reuse it as many times as you need.</p><div class="card" style="font:700 16px monospace;text-align:center;word-break:break-all;margin:12px 0">${esc(k)}</div><div class="row"><button class="btn g" onclick="dlKey('${esc(un)}')">⬇ Download</button><button class="btn g" onclick="navigator.clipboard&&navigator.clipboard.writeText(S._k);toast('Copied')">Copy</button></div><label style="display:flex;gap:8px;margin:14px 0;align-items:center"><input type="checkbox" id="sk" style="width:auto;margin:0"> I have saved my secret key</label><button class="btn" style="width:100%" onclick="if(!$('sk').checked)return toast('Please save your key first');V.lock=false;cm();load(true)">Continue</button>`)}
function dlKey(un){const b=new Blob([`${S.set.name} secret key\nUsername: ${un}\nSecret key: ${S._k}\n\nKeep this file private. Use it on the "Forgot password" tab to reset your password.\n`],{type:'text/plain'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`${S.set.name}-secret-key-${un}.txt`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
async function logout(){await api('logout',{});S.me=null;V.view='home';load()}
function render(){const m=S.me;
 $('nr').innerHTML=m?`<span class="tag">${m.admin?'Owner':esc(m.un)+' · '+fmt(m.bal)}</span><button class="btn g s" onclick="load()" title="Refresh">↻</button><button class="btn g s" onclick="logout()">Log out</button>`:`<button class="btn g s" onclick="authM('login')">Log In</button><button class="btn s" onclick="authM('signup')">Sign Up</button>`;
 $('app').innerHTML=!m||V.view==='home'?home():m.admin?adminV():m.role==='worker'?workerV():advV();drawChat()}
function home(){const f=[['🗂️','Your own categories','Pick a category or create one that fits your job.'],['🔎','Easy job search','Workers browse open jobs and pick what suits them.'],['👛','Simple wallet','Clear balance, history and smooth withdrawals.'],['📎','Proof submission','Submit text, a text file or a screenshot as proof.'],['💬','Built-in chat','Message, share images and react, all in the app.'],['⚡','Light & fast','No heavy scripts, so pages open instantly.']];
return `<section class="hero"><span class="badge">✔ Approved work. Secure wallet.</span><h1>Small jobs.<br><b>Done and paid.</b></h1><p>Post a job, review the proof, and pay only when you approve. Workers find jobs and withdraw what they earn.</p>
<div class="row"><button class="btn" onclick="authM('signup','advertiser')">Post a Job</button><button class="btn g" onclick="authM('signup','worker')">Find Work →</button></div></section>
<div class="stats">${[['Pay on approval','Money moves only after you accept the work'],['Proof required','Text, file or screenshot with every submission'],['Live chat','Talk to admins and workers instantly'],['Easy withdraw','Request a payout in a few taps']].map(s=>`<div class="card stat"><b style="font-size:18px">${s[0]}</b><span>${s[1]}</span></div>`).join('')}</div>
<h2>How it works</h2><p class="sub">Three steps from job to payout</p><div class="grid">${[['1','Sign up','Join as a worker or as someone who posts jobs.'],['2','Post or pick a job','Add a job with a reward, or choose one from the list.'],['3','Approve and pay','Approved work is paid straight into the wallet.']].map(s=>`<div class="card"><div class="ic">${s[0]}</div><h3>${s[1]}</h3><p>${s[2]}</p></div>`).join('')}</div>
<h2>What you get</h2><p class="sub">Everything in one place</p><div class="grid">${f.map(s=>`<div class="card"><div class="ic">${s[0]}</div><h3>${s[1]}</h3><p>${s[2]}</p></div>`).join('')}</div>
<h2>Questions</h2><p class="sub"> </p>${[['How do I post a job?','Open Post Job, choose or add a category, set the reward and number of workers, then publish.'],['When does the worker get paid?','As soon as you approve a submission, the reward leaves your balance and lands in the worker wallet.'],['How do I withdraw?','Open Wallet, enter the amount and your account details, then send the request.']].map(q=>`<details><summary>${q[0]}</summary><p>${q[1]}</p></details>`).join('')}`}

const txT=()=>`<div class="card sc"><h3>History</h3><table>${S.tx.map(x=>`<tr><td>${esc(x.n)}<br><small style="color:var(--mut)">${when(x.at)}</small></td><td style="text-align:right;font-weight:700;color:var(${x.a>0?'--ok':'--bad'})">${x.a>0?'+':''}${fmt(x.a)}</td></tr>`).join('')||'<tr><td>No transactions yet</td></tr>'}</table></div>`;
const bal=()=>`<div class="bal">Available balance<b>${fmt(S.me.bal)}</b></div>`;
function workerV(){let h=tabs([['market','Marketplace'],['work','My Work'],['wallet','Wallet']]);
 if(V.tab==='wallet')return h+bal()+`<div class="grid"><div class="card"><h3>Withdraw</h3><p style="margin-bottom:10px">Minimum ${fmt(S.set.minWd)}</p><label>Amount</label><input id="am" type="number" min="${S.set.minWd}"><label>Method</label><select id="mt"><option>Bank transfer</option><option>Mobile wallet</option><option>USDT</option></select><label>Account details</label><input id="ac" maxlength="120" placeholder="Bank, account number, name"><button class="btn" onclick="wd()">Request withdrawal</button></div><div class="card sc"><h3>Withdrawals</h3><table>${S.wd.slice().reverse().map(w=>`<tr><td>${fmt(w.a)}<br><small style="color:var(--mut)">${when(w.at)}</small></td><td style="text-align:right">${tag(w.st)}</td></tr>`).join('')||'<tr><td>None yet</td></tr>'}</table></div></div><div style="margin-top:16px">${txT()}</div>`;
 if(V.tab==='work')return h+`<div class="card sc"><table><tr><th>Job</th><th>Reward</th><th>Status</th></tr>${S.subs.slice().reverse().map(s=>`<tr><td>${esc(s.tt)}${s.why?`<br><small style="color:var(--bad)">${esc(s.why)}</small>`:''}</td><td>${fmt(s.r)}</td><td>${tag(s.st)}</td></tr>`).join('')||'<tr><td colspan=3>Nothing submitted yet</td></tr>'}</table></div>`;
 const cs=['All',...S.cats];h+=`<div class="tabs">${cs.map((c,i)=>`<div class="tab ${V.cat===c?'on':''}" onclick="V.cat=S.cats[${i-1}]||'All';render()">${esc(c)}</div>`).join('')}</div><div class="grid">`;
 const mine=new Set(S.subs.map(s=>s.tid));S.tasks.filter(t=>V.cat==='All'||t.c===V.cat).forEach(t=>{h+=`<div class="card"><div class="top"><span class="tag">${esc(t.c)}</span><span class="rw">${fmt(t.r)}</span></div><h3>${esc(t.t)}</h3><p>${esc(t.d)}</p><p style="margin:10px 0"><small>${t.left} spots left</small></p>${mine.has(t.id)?'<span class="tag ok">Submitted</span>':`<button class="btn s" ${t.left<1?'disabled':''} onclick="taskM(${t.id})">View & do job</button>`}</div>`});
 return h+(S.tasks.length?'':'<div class="card">No jobs available right now. Check back soon.</div>')+'</div>'}
function taskM(id){const t=S.tasks.find(x=>x.id===id);om(`<span class="tag">${esc(t.c)}</span><h3>${esc(t.t)}</h3><p style="color:var(--mut)">${esc(t.d)}</p>${t.link?`<p><a href="${esc(t.link)}" target="_blank" rel="noopener noreferrer nofollow" style="color:var(--p);font-weight:700">Open job link ↗</a></p>`:''}<p class="rw">Reward: ${fmt(t.r-Math.floor(t.r*S.set.fee/100))}</p><label>Proof (text)</label><textarea id="pt" rows="3" maxlength="5000" placeholder="Describe what you did / paste your username or link"></textarea><label>Proof file (screenshot or .txt)</label><input id="pf" type="file" accept="image/*,.txt"><div class="row" style="justify-content:flex-end"><button class="btn g" onclick="cm()">Cancel</button><button class="btn" onclick="submitW(${id})">Submit work</button></div>`)}
async function submitW(id){let text=$('pt').value.trim();const f=$('pf').files[0];let img='',fn=f?f.name:'';
 const go=async()=>{if(await api('submit',{tid:id,text,img,fn})){cm();toast('Submitted for approval');V.tab='work';load()}};
 if(!f)return go();if(f.type.startsWith('image/')){if(f.size>1.5e6)return toast('Image too large (max 1.5MB)');const r=new FileReader();r.onload=()=>{img=r.result;go()};r.readAsDataURL(f)}
 else if(/\.txt$/i.test(f.name)){const r=new FileReader();r.onload=()=>{text=(text+'\n'+String(r.result)).trim().slice(0,5000);go()};r.readAsText(f)}else toast('Use an image or .txt file')}
async function wd(){if(await api('withdraw',{amount:val('am'),method:$('mt').value,account:val('ac')})){toast('Withdrawal requested');load()}}
function advV(){let h=tabs([['post','Post Job'],['subs','Review'],['mine','My Jobs'],['wallet','Wallet']]);
 if(V.tab==='wallet')return h+bal()+`<div class="grid"><div class="card"><h3>Add funds</h3><p style="white-space:pre-wrap;margin-bottom:10px">${esc(S.set.pay)}</p><label>Amount you paid</label><input id="am" type="number" min="1"><label>Payment reference / sender name</label><input id="rf" maxlength="100"><button class="btn" onclick="dep()">I have paid</button></div><div class="card sc"><h3>Deposits</h3><table>${S.dep.slice().reverse().map(d=>`<tr><td>${fmt(d.a)}<br><small style="color:var(--mut)">${when(d.at)}</small></td><td style="text-align:right">${tag(d.st)}</td></tr>`).join('')||'<tr><td>None yet</td></tr>'}</table></div></div><div style="margin-top:16px">${txT()}</div>`;
 if(V.tab==='mine')return h+`<div class="card sc"><table><tr><th>Job</th><th>Reward</th><th>Spots</th></tr>${S.tasks.map(t=>`<tr><td>${esc(t.t)}<br>${tag(t.st)}</td><td>${fmt(t.r)}</td><td>${t.left}/${t.n}</td></tr>`).join('')||'<tr><td colspan=3>No jobs yet</td></tr>'}</table></div>`;
 if(V.tab==='subs')return h+`<div class="grid">${subsH(S.subs.slice().reverse())||'<div class="card">No submissions yet</div>'}</div>`;
 return h+`<div class="card"><h3>Post a job</h3><label>Title</label><input id="tt" maxlength="80"><label>Description</label><textarea id="td" rows="3" maxlength="800"></textarea><label>Link (optional)</label><input id="tl" placeholder="https://…"><label>Category</label><select id="tc">${S.cats.map(c=>`<option>${esc(c)}</option>`).join('')}</select><div style="display:flex;gap:8px"><input id="nc" placeholder="Or add a new category" maxlength="30"><button class="btn g" style="height:44px;margin-top:5px" onclick="addC()">Add</button></div><div class="grid" style="gap:12px"><div><label>Reward per worker</label><input id="tr" type="number" min="1"></div><div><label>Number of workers</label><input id="tn" type="number" min="1"></div></div><p style="margin:0 0 10px"><small>Your balance must cover reward × workers. Payment leaves your balance only when you approve.</small></p><button class="btn" onclick="post()">Publish job</button></div>`}
function subsH(a){return a.map(s=>`<div class="card"><div class="top"><b>${esc(s.tt)}</b>${tag(s.st)}</div><p><small>by ${esc(s.un)} · ${when(s.at)}</small></p><p style="white-space:pre-wrap">${esc(s.text)||'<i>No text</i>'}</p>${s.img?`<a href="/api/img?k=${esc(s.img)}" target="_blank"><img src="/api/img?k=${esc(s.img)}" alt="proof" loading="lazy" style="max-width:100%;border-radius:12px;margin-top:8px"></a>`:''}${s.st==='pending'?`<div class="row" style="justify-content:flex-start;margin-top:10px"><button class="btn ok s" onclick="dec(${s.id},1)">Approve (−${fmt(s.r)})</button><button class="btn bad s" onclick="dec(${s.id},0)">Reject</button></div>`:''}</div>`).join('')}
async function dec(id,ok){let why='';if(!ok){why=prompt('Reason for rejecting (optional):');if(why===null)return}if(await api('decide',{id,ok,why}))load()}
async function addC(){const n=val('nc');if(n&&await api('cat',{name:n})){const j=await api('state');if(j)S=j;render();toast('Category added')}}
async function post(){if(await api('task',{t:val('tt'),d:val('td'),link:val('tl'),c:$('tc').value,r:val('tr'),n:val('tn')})){toast('Job published');load()}}
async function dep(){if(await api('deposit',{amount:val('am'),ref:val('rf')})){toast('Sent. The owner will confirm your payment.');load()}}
const adm=async(p,b)=>{if(await api('admin/'+p,b))load()};
function adminV(){const s=S.stats;let h=tabs([['ov','Overview'],['users','Users'],['wd','Withdrawals'+(s.pendW?' ('+s.pendW+')':'')],['dep','Deposits'+(s.pendD?' ('+s.pendD+')':'')],['jobs','Jobs'],['subs','Submissions'],['set','Settings']]);
 if(V.tab==='users'){const q=V.q.toLowerCase();return h+`<input placeholder="Search username" value="${esc(V.q)}" oninput="V.q=this.value;render();this.focus()"><div class="card sc"><table><tr><th>User</th><th>Role</th><th>Balance</th><th></th></tr>${S.users.filter(u=>u.un.includes(q)).map(u=>`<tr><td>${esc(u.un)}${u.banned?' '+tag('rejected').replace('rejected','banned'):''}<br><small style="color:var(--mut)">${when(u.at)}</small></td><td>${u.role}</td><td>${fmt(u.bal)}</td><td style="white-space:nowrap"><button class="btn g s" onclick="ua(${u.id},'delta')">±</button> <button class="btn g s" onclick="ua(${u.id},'bal')">Set</button> <button class="btn ${u.banned?'ok':'bad'} s" onclick="ua(${u.id},'${u.banned?'unban':'ban'}')">${u.banned?'Unban':'Ban'}</button></td></tr>`).join('')||'<tr><td>No users</td></tr>'}</table></div>`}
 if(V.tab==='wd')return h+`<div class="card sc"><table><tr><th>Worker</th><th>Amount</th><th>Pay to</th><th></th></tr>${S.wd.slice().reverse().map(w=>`<tr><td>${esc(w.un)}<br><small style="color:var(--mut)">${when(w.at)}</small></td><td>${fmt(w.a)}</td><td>${esc(w.m)}<br>${esc(w.acc)}</td><td>${w.st==='pending'?`<button class="btn ok s" onclick="adm('wd',{id:${w.id},ok:1})">Paid</button> <button class="btn bad s" onclick="adm('wd',{id:${w.id},ok:0})">Reject</button>`:tag(w.st)}</td></tr>`).join('')||'<tr><td colspan=4>None</td></tr>'}</table></div>`;
 if(V.tab==='dep')return h+`<div class="card sc"><table><tr><th>Advertiser</th><th>Amount</th><th>Reference</th><th></th></tr>${S.dep.slice().reverse().map(w=>`<tr><td>${esc(w.un)}<br><small style="color:var(--mut)">${when(w.at)}</small></td><td>${fmt(w.a)}</td><td>${esc(w.ref)}</td><td>${w.st==='pending'?`<button class="btn ok s" onclick="adm('dep',{id:${w.id},ok:1})">Credit</button> <button class="btn bad s" onclick="adm('dep',{id:${w.id},ok:0})">Reject</button>`:tag(w.st)}</td></tr>`).join('')||'<tr><td colspan=4>None</td></tr>'}</table></div>`;
 if(V.tab==='jobs')return h+`<div class="card sc"><table><tr><th>Job</th><th>Reward</th><th>Spots</th><th></th></tr>${S.tasks.map(t=>`<tr><td>${esc(t.t)}<br><small style="color:var(--mut)">by ${esc(t.un)}</small> ${tag(t.st)}</td><td>${fmt(t.r)}</td><td>${t.left}/${t.n}</td><td style="white-space:nowrap"><button class="btn g s" onclick="adm('task',{id:${t.id},action:'${t.st==='active'?'pause':'resume'}'})">${t.st==='active'?'Pause':'Resume'}</button> <button class="btn bad s" onclick="if(confirm('Delete this job?'))adm('task',{id:${t.id},action:'delete'})">Delete</button></td></tr>`).join('')||'<tr><td colspan=4>None</td></tr>'}</table></div>`;
 if(V.tab==='subs')return h+`<div class="grid">${subsH(S.subs.slice().reverse().slice(0,60))||'<div class="card">None</div>'}</div>`;
 if(V.tab==='set'){const x=S.set;return h+`<div class="grid"><div class="card"><h3>Site settings</h3><label>Site name</label><input id="sn" value="${esc(x.name)}"><label>Currency symbol</label><input id="sc" value="${esc(x.cur)}"><label>Minimum withdrawal</label><input id="sm" type="number" value="${x.minWd}"><label>Platform fee % (taken from each approved reward)</label><input id="sf" type="number" value="${x.fee}"><label>Payment instructions shown to advertisers</label><textarea id="sp" rows="4">${esc(x.pay)}</textarea><label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="sx" style="width:auto;margin:0" ${x.maint?'checked':''}> Maintenance mode (pauses signups and actions)</label><br><button class="btn" onclick="saveSet()">Save settings</button></div><div class="card"><h3>Categories</h3>${S.cats.map(c=>`<p style="display:flex;justify-content:space-between;margin:6px 0;color:var(--ink)">${esc(c)}<button class="btn bad s" onclick="adm('cat',{action:'del',name:'${esc(c).replace(/'/g,'')}'})">✕</button></p>`).join('')}<div style="display:flex;gap:8px"><input id="nc" placeholder="New category"><button class="btn g" style="height:44px;margin-top:5px" onclick="adm('cat',{name:val('nc')})">Add</button></div></div></div>`}
 return h+`<div class="stats">${[['Workers',s.workers],['Advertisers',s.advertisers],['Jobs',s.tasks],['Pending reviews',s.pendS],['Pending withdrawals',s.pendW],['Pending deposits',s.pendD],['Worker balances',fmt(s.wbal)],['Advertiser balances',fmt(s.abal)],['Your fee earnings',fmt(s.rev)]].map(x=>`<div class="card stat"><b>${x[1]}</b><span>${x[0]}</span></div>`).join('')}</div><div class="card sc"><h3>Recent activity</h3><table>${S.log.map(l=>`<tr><td>${esc(l.m)}</td><td style="text-align:right;color:var(--mut)">${when(l.at)}</td></tr>`).join('')||'<tr><td>Nothing yet</td></tr>'}</table></div>`}
async function ua(id,a){let amount;if(a==='delta'||a==='bal'){const v=prompt(a==='delta'?'Amount to add (use minus to subtract):':'Set new balance to:');if(v===null)return;amount=Number(v);if(!Number.isFinite(amount))return toast('Invalid number')}if(a==='ban'&&!confirm('Ban this user?'))return;adm('user',{id,action:a,amount})}
function saveSet(){adm('settings',{name:val('sn'),cur:val('sc'),minWd:val('sm'),fee:val('sf'),pay:$('sp').value,maint:$('sx').checked})}
function tc(){$('chat').classList.toggle('on');drawChat();if($('chat').classList.contains('on'))pollChat()}
function drawChat(){const m=$('msgs');if(!m)return;const me=S.me;
 if(!me){m.innerHTML='<p style="color:var(--mut);text-align:center;margin-top:40px">Log in to join the chat.</p>';return}
 m.innerHTML=S.chat.length?S.chat.map(c=>{const rs={};Object.values(c.r||{}).forEach(e=>rs[e]=(rs[e]||0)+1);const rr=Object.entries(rs).map(([e,n])=>e+(n>1?n:'')).join(' ');const mine=c.adm?!!me.admin:c.u===me.un;
  return `<div class="m ${mine?'me':''}"><small>${c.adm?'⭐ Admin':esc(c.u)}</small>${esc(c.t)}${c.img?`<img src="/api/img?k=${esc(c.img)}" alt="">`:''}<div class="ems">${['👍','❤️','😂','🔥'].map(e=>`<span onclick="rx(${c.id},'${e}')">${e}</span>`).join('')}${me.admin?`<span onclick="cdel(${c.id})">🗑</span>`:''}</div>${rr?`<span class="rx">${rr}</span>`:''}</div>`}).join(''):'<p style="color:var(--mut);text-align:center;margin-top:40px">No messages yet. Say hi!</p>';m.scrollTop=m.scrollHeight}
const setChat=j=>{if(j&&j.chat){S.chat=j.chat;drawChat()}};
async function send(){if(!S.me)return authM('login');const t=val('ci');if(!t)return;$('ci').value='';setChat(await api('chat',{t}))}
function sendImg(i){if(!S.me){i.value='';return authM('login')}const f=i.files[0];i.value='';if(!f)return;if(f.size>1.5e6)return toast('Image max 1.5MB');const r=new FileReader();r.onload=async()=>setChat(await api('chat',{img:r.result,t:''}));r.readAsDataURL(f)}
async function rx(id,e){setChat(await api('react',{id,e}))}
async function cdel(id){if(await api('admin/chatdel',{id}))pollChat()}
function pollChat(){fetch('/api/chat').then(r=>r.json()).then(j=>{if(j.chat&&JSON.stringify(j.chat.map(x=>[x.id,x.r]))!==JSON.stringify(S.chat.map(x=>[x.id,x.r]))){S.chat=j.chat;drawChat()}}).catch(()=>{})}
setInterval(()=>{if($('chat').classList.contains('on')&&!document.hidden)pollChat()},4000);
load(true);
</script></body></html>
